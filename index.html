{id:'cappellotrovato',when:()=>!(att('ombra')>=1)&&S.wx==='sole',w:()=>1.2,title:'Il cappello sul ramo',
 text:`Un cappello di tela appeso a un ramo, accanto al sentiero. Nessuno in vista da ore.`,
 o:[{l:'Lo prendi: lo lascerai al rifugio',out:[O(1,'g',`Intanto ti ripara dal sole.`,{gain:'cappello'})]},
    {l:'Lo lasci dov\'è',out:[O(1,'m',`Qualcuno tornerà a prenderlo.`)]}]},
{id:'fantasmi',when:()=>S.wx==='pioggia'||S.wx==='nebbia',w:()=>1.2,title:'Storie in capanna',
 text:`In una capanna, tre escursionisti aspettano che il tempo migliori raccontandosi storie di fantasmi della montagna.`,
 o:[{l:'Ti siedi ad ascoltare',min:30,out:[O(2,'g',`Ridi, rabbrividisci, riparti col tempo migliore.`,{m:8,e:5}),O(1,'m',`Riparti con un po' di paura della nebbia.`,{m:2,e:5})]},
    {l:'Ne racconti una tu',min:30,out:[O(1,'g',`La tua è la migliore. Applausi.`,{m:10,e:5,timbro:'Narratore di montagna'})]},
    {l:'Prosegui sotto la pioggia',out:[O(1,'m',`Nessun fantasma, solo acqua.`,{m:-2})]}]},
{id:'compleanno',w:()=>1,title:'Il compleanno',
 text:`Un gruppo festeggia un compleanno a bordo sentiero, con una torta portata fin quassù.`,
 o:[{l:'Ti unisci al coro di auguri',min:15,out:[O(1,'g',`Ti danno una fetta. È la torta più alta della sua vita.`,{m:8,e:5})]},
    {l:'Fai gli auguri passando',out:[O(1,'g',`Ti salutano tutti.`,{m:3})]}]},
{id:'proposta',w:()=>0.6,title:'La proposta',
 text:`Un ragazzo ti ferma, emozionatissimo: tra cinque minuti chiederà alla fidanzata di sposarlo, in quel punto panoramico. Puoi fare il video?`,
 o:[{l:'Certo che sì',req:()=>inv('batteria')>=8,min:20,out:[O(4,'g',`Ha detto sì. Piangono tutti, anche tu.`,{give:{batteria:-8},m:14,timbro:'Testimone di una proposta'}),O(1,'g',`Ha detto «Ci penso». Il video resterà agli atti.`,{give:{batteria:-8},m:6})]},
    {l:'Ti scusi: telefono scarico',out:[O(1,'m',`Gli auguri di cuore.`,{m:2})]}]},
{id:'gara',w:()=>0.8,title:'La gara',
 text:`Pettorali, cronometri: è in corso una gara di corsa in montagna. Il sentiero è pieno di atleti che arrivano a ondate.`,
 o:[{l:'Ti fermi a fare il tifo',min:20,out:[O(1,'g',`Ti batti le mani fino a farti male.`,{m:8})]},
    {l:'Prosegui spostandoti a ogni ondata',min:15,out:[O(1,'m',`Fermati, riparti, fermati.`,{m:-2})]},
    {l:'Ti metti a correre accanto all\'ultimo',out:[O(1,'g',`Lo spingi fino al ristoro. Ti ringrazia con un bicchiere di sali.`,{e:-8,m:8})]}]},
{id:'zainoaltrui',w:()=>1,title:'Il ragazzo in difficoltà',
 text:`Un ragazzo è seduto pallido accanto al suo zaino. Non sta bene e non ce la fa a portarlo fino al rifugio.`,
 o:[{l:'Porti tu parte del suo carico',min:20,out:[O(1,'g',`Tre chili in più, un amico in più.`,{e:-10,xp:10,m:8,mem:'aiutato'})]},
    {l:'Gli dai una barretta e cammini con lui',use:{barrette:1},req:()=>inv('barrette')>0,min:30,out:[O(1,'g',`Piano piano si riprende.`,{xp:6,m:6})]},
    {l:'Prometti di avvisare il rifugio',out:[O(1,'m',`Mandano qualcuno incontro a lui.`,{m:-1})]}]},
{id:'felicita',when:()=>S.morale>70,w:()=>2,title:'Felice',
 text:`Ti accorgi all'improvviso di essere felice. Così, senza motivo, in mezzo al niente.`,
 o:[{l:'Ti fermi a sentirlo',min:5,out:[O(1,'g',`Te lo ricorderai.`,{m:6})]},
    {l:'Lo scrivi sul taccuino',min:5,out:[O(1,'g',`«Oggi ero felice». Basta questo.`,{m:5,timbro:'Una giornata felice'})]}]},
{id:'passerella',ter:['gola'],w:()=>2.5,title:'La passerella sul vuoto',
 text:`Una passerella di metallo è fissata alla parete della gola. Sotto, il fiume tuona a trenta metri.`,
 o:[{l:'Attraversi guardando avanti',out:[O(3,'g',`Fatto, con le gambe molli.`,{xp:3}),O(1,'b',`A metà ti blocchi. Ci metti un quarto d'ora.`,{min:15,m:-6})]},
    {l:'Ti fermi a metà a guardare giù',min:5,out:[O(2,'g',`Spaventoso e meraviglioso.`,{m:8}),O(1,'b',`Vertigine vera. Finisci a quattro zampe.`,{m:-6})]}]},
{id:'omettocrollato',w:()=>1.2,title:'L\'ometto crollato',
 text:`Un ometto di pietra, importante per l'orientamento, è crollato. Con la nebbia qualcuno potrebbe perdersi.`,
 o:[{l:'Lo ricostruisci',min:15,out:[O(1,'g',`Pietra su pietra. Chi verrà dopo non lo saprà mai, ma tu sì.`,{xp:6,m:6,e:-3})]},
    {l:'Prosegui',out:[O(1,'m',`Speriamo non arrivi la nebbia.`)]}]},
{id:'telefonatalavoro',when:()=>inv('batteria')>0,w:()=>1,title:'Il capo',
 text:`Il telefono squilla. È il tuo capo. Sei in ferie.`,
 o:[{l:'Rispondi',min:15,out:[O(1,'m',`Una domanda veloce. Diventa mezz'ora.`,{m:-6,give:{batteria:-8}}),O(1,'g',`Voleva solo augurarti buone vacanze. Incredibile.`,{m:4})]},
    {l:'Non rispondi e spegni',out:[O(1,'g',`Un brivido di libertà.`,{m:5}),O(1,'m',`Il senso di colpa ti segue per un chilometro.`,{m:-2})]}]},
{id:'cappellodimenticato',when:()=>(att('ombra')>=1),w:()=>1.2,title:'Il cappello',
 text:`Ti tocchi la testa: niente cappello. L'hai lasciato alla pausa di mezz'ora fa.`,
 o:[{l:'Torni a prenderlo',min:40,out:[O(1,'m',`C'era ancora.`,{e:-6})]},
    {l:'Lo lasci alla montagna',out:[O(1,'m',`Addio, compagno.`,{lose:'cappello',m:-3})]}]},
{id:'calzinoperso',when:()=>inv('calze')>0,w:()=>1,title:'Il calzino fuggitivo',
 text:`Le calze stese ad asciugare sullo zaino sono una sola. L'altra è caduta chissà dove.`,
 o:[{l:'Torni indietro a cercarla',min:25,out:[O(1,'g',`Appesa a un cespuglio, come una bandiera.`,{e:-4}),O(1,'b',`Persa per sempre.`,{e:-4,give:{calze:-1}})]},
    {l:'Ti rassegni',out:[O(1,'m',`Un paio di ricambio in meno.`,{give:{calze:-1}})]}]},
{id:'blogger',w:()=>0.8,title:'L\'intervista',
 text:`Una ragazza con la videocamera sta facendo un documentario sui camminatori. Ti chiede due parole.`,
 o:[{l:'Racconti il tuo cammino',min:20,out:[O(2,'g',`Le piace la tua storia. «Sarai nel montaggio finale.»`,{m:8,timbro:'Intervistato in montagna'}),O(1,'m',`Ti blocchi davanti alla telecamera. Dici solo «bello».`,{m:-1})]},
    {l:'Preferisci di no',out:[O(1,'m',`Sorride e passa al prossimo.`)]}]},
{id:'risata',when:()=>S.energia<50||S.stati.size>=2,w:()=>1.5,title:'La risata',
 text:`Piedi bagnati, gambe a pezzi, zaino pesante. All'improvviso ti viene da ridere. Tanto.`,
 o:[{l:'Ridi fino alle lacrime',min:5,out:[O(1,'g',`Non sai neanche perché. Ma funziona.`,{m:10})]},
    {l:'Ti ricomponi',out:[O(1,'m',`Torni serio. Peccato.`,{m:2})]}]},
{id:'italiani',w:()=>1,title:'Italiani!',
 text:`Senti parlare italiano. Un gruppo di Bergamo, con una moka e un fornelletto.`,
 o:[{l:'Ti fermi per il caffè',min:25,out:[O(2,'g',`Caffè vero, in mezzo al nulla. Quasi piangi.`,{m:12,e:5,timbro:'Un caffè vero'}),O(1,'g',`Ti invitano anche a cena al rifugio.`,{m:10,e:5,mem:'cena'})]},
    {l:'Un saluto veloce',out:[O(1,'g',`«Ciao! Da dove?» Bastano due parole.`,{m:4})]}]},
{id:'ultimabarretta',when:()=>inv('barrette')===1,w:()=>3,title:'L\'ultima barretta',
 text:`Nello zaino resta una sola barretta. Hai fame adesso, ma la tappa è ancora lunga.`,
 o:[{l:'La mangi adesso',use:{barrette:1},out:[O(1,'g',`Il presente vince.`,{e:7,m:3})]},
    {l:'La conservi per l\'emergenza',out:[O(1,'m',`Saggio. Lo stomaco non è d'accordo.`,{e:-3})]}]},
{id:'formaggio',when:()=>S.wx==='sole'&&inv('pasti')>0,w:()=>1.5,title:'Il formaggio suda',
 text:`Il formaggio nello zaino è diventato morbido e lucido col caldo.`,
 o:[{l:'Lo mangi subito, prima che vada a male',use:{pasti:1},min:10,out:[O(1,'g',`Pranzo anticipato, ancora buono.`,{e:10,flag:'pranzo'})]},
    {l:'Lo sposti all\'ombra nello zaino e speri',out:[O(2,'g',`Regge fino a sera.`),O(1,'b',`Stasera ti farà male.`,{later:{segs:2,txt:'Il formaggio scaldato al sole non era più buono.',fx:{add:['malessere']}}})]}]},
{id:'nuvolaforma',when:()=>S.wx==='nuvole'||S.wx==='sole',w:()=>1.2,title:'La nuvola',
 text:`Una nuvola sopra la cresta ha la forma perfetta di una renna. O di un drago. O di tua zia.`,
 o:[{l:'Ti sdrai a guardarla cambiare',min:10,out:[O(1,'g',`Ora è una barca. Poi niente.`,{m:6,e:3})]},
    {l:'Sorridi e prosegui',out:[O(1,'g',`Bella.`,{m:2})]}]},
{id:'orasbagliata',when:()=>S.clock>840,w:()=>1.5,title:'Che ore sono?',
 text:()=>`Guardi l'orologio: sono le ${hhmm(S.clock)}. Eri convinto fosse almeno un'ora prima.`,
 o:[{l:'Acceleri decisamente',min:-25,out:[O(1,'m',`Recuperi, col fiato corto.`,{e:-10})]},
    {l:'Accetti di arrivare tardi',out:[O(1,'m',`Il letto, forse, non ci sarà.`,{m:-3})]}]},
{id:'rovi',ter:['betulle','valle','gola'],w:()=>1.5,title:'Il tratto invaso',
 text:`Il sentiero è invaso da cespugli spinosi alti fino alla vita.`,
 o:[{l:'Ci passi in mezzo deciso',out:[O(1,'m',`Gambe graffiate, ma passi.`,{m:-3}),O(1,'b',`Pantaloni strappati e graffi ovunque.`,{m:-6})]},
    {l:'Cerchi un passaggio sul pendio',min:20,out:[O(2,'g',`Un varco tra i sassi.`,{e:-4}),O(1,'b',`Il pendio è peggio.`,{e:-8,m:-3})]}]},
{id:'temporalevalle',when:()=>S.wx==='sole'||S.wx==='nuvole',ter:['altopiano','valle'],w:()=>1.5,title:'Il temporale laggiù',
 text:`Dall'alto vedi un temporale scaricarsi sulla valle accanto: fulmini, pioggia a colonne, sole intorno.`,
 o:[{l:'Ti fermi a guardarlo',min:15,out:[O(1,'g',`Uno spettacolo che pochi vedono dall'alto.`,{m:10,timbro:'Il temporale visto dall\'alto'})]},
    {l:'Acceleri, non si sa mai',min:-10,out:[O(1,'m',`Prudenza.`,{e:-5})]}]},
{id:'caneescursionista',w:()=>1.2,title:'Il cane in cammino',
 text:`Un cane con il suo zainetto cammina accanto al padrone. Ti annusa le tasche: sa dove tieni le barrette.`,
 o:[{l:'Gli dai un pezzetto',use:{barrette:1},req:()=>inv('barrette')>0,out:[O(1,'g',`Amico per la vita. Il padrone ride.`,{m:7})]},
    {l:'Lo accarezzi e basta',out:[O(1,'g',`Coda che va a mille.`,{m:5})]}]}
);
EV.forEach(e=>e.cat=e.cat||'comune');
/* ---- blocco comuni 08: 25 eventi ---- */
EV.push(
{id:'cappuccio',when:()=>S.wx==='pioggia'||S.wx==='vento',w:()=>2,title:'Il cappuccio',
 text:`Il vento ti strappa il cappuccio dalla testa ogni dieci passi. La pioggia ti entra nel collo.`,
 o:[{l:'Stringi i cordini fino a sembrare un astronauta',req:()=>(att('impermeabile')>=1),min:3,out:[O(1,'g',`Vedi solo davanti a te, ma sei asciutto.`)]},
    {l:'Lo tieni con una mano',out:[O(1,'m',`Un braccio in meno per l'equilibrio.`,{e:-4,m:-2})]},
    {l:'Ci rinunci',out:[O(1,'b',`Collo fradicio, brividi.`,{m:-5,add:['freddo']})]}]},
{id:'guadogelido',when:()=>(att('guado')>=1),w:()=>2,title:'Acqua di ghiacciaio',
 text:`Il torrente scende direttamente dal nevaio. Con i sandali, i piedi ti fanno male dopo tre passi.`,
 o:[{l:'Passi veloce e ti scaldi i piedi dopo',min:15,out:[O(2,'g',`Dolore acuto, poi un formicolio piacevole.`,{m:2}),O(1,'m',`Piedi insensibili per mezz'ora.`,{add:['freddo']})]},
    {l:'Passi con le scarpe, tanto vale',out:[O(1,'m',`Piedi bagnati ma non congelati.`,{add:['bagnati']})]}]},
{id:'scarpaaltrui',w:()=>1,title:'La scarpa di un altro',
 text:`Un escursionista ha la suola staccata e mezza tappa davanti. Ti guarda con speranza.`,
 o:[{l:'Gliela ripari col tuo nastro',req:()=>(att('riparazione')>=1),min:15,out:[O(1,'g',`Ti promette una birra al prossimo rifugio.`,{xp:8,m:7,mem:'birra'})]},
    {l:'Gli presti un laccio per legarla',min:5,out:[O(1,'g',`Una soluzione da campo. Ti ringrazia.`,{xp:3,m:4})]},
    {l:'Gli auguri buona fortuna',out:[O(1,'m',`Lo vedi zoppicare via.`,{m:-3})]}]},
{id:'acquafiltrata',when:()=>(att('acquaSicura')>=1),w:()=>1.2,title:'Il filtro',
 text:`Una coppia si è fermata a un torrente ma non ha modo di depurare l'acqua. Guardano il tuo filtro.`,
 o:[{l:'Filtri l\'acqua anche per loro',min:15,out:[O(1,'g',`Due borracce piene e due sorrisi.`,{xp:5,m:6})]},
    {l:'Spieghi che il filtro è lento e prosegui',out:[O(1,'m',`Capiscono, più o meno.`,{m:-2})]}]},
{id:'solitariocarte',when:()=>(att('svago')>=1)&&(S.wx==='pioggia'||S.wx==='nebbia'),w:()=>2,title:'Un solitario',
 text:`Ti ripari in una capanna ad aspettare che passi il peggio. Hai le carte nello zaino.`,
 o:[{l:'Un solitario mentre aspetti',min:30,out:[O(1,'g',`Il tempo vola. Fuori, è quasi smesso.`,{m:6,e:5})]},
    {l:'Riparti subito',out:[O(1,'m',`Le carte restano nello zaino.`)]}]},
{id:'pontesosta',w:()=>1.5,title:'Il ponte di legno',
 text:`Un ponticello di legno sopra un torrente limpidissimo. Sotto, si vedono le trote.`,
 o:[{l:'Ti siedi coi piedi penzoloni',min:15,out:[O(1,'g',`Le trote ti ignorano. Tu le guardi per un quarto d'ora.`,{m:8,e:3})]},
    {l:'Passi',out:[O(1,'m',`Uno sguardo veloce.`,{m:1})]}]},
{id:'confineparco',w:()=>1,title:'Il confine del parco',
 text:`Un cartello segna l'ingresso nel parco nazionale. Le regole: niente fuochi, niente tende fuori dalle aree indicate.`,
 o:[{l:'Leggi tutte le regole',min:5,out:[O(1,'g',`Scopri anche dove sono le sorgenti nel parco.`,{xp:2,m:2})]},
    {l:'Una foto al cartello e via',min:2,out:[O(1,'g',`Ricordo.`,{m:3})]}]},
{id:'sassocuore',w:()=>1,title:'Il sasso a cuore',
 text:`Tra i sassi del sentiero, uno ha la forma perfetta di un cuore.`,
 o:[{l:'Lo prendi per qualcuno a casa',out:[O(1,'g',`Pesa poco, vale tanto.`,{kg:0.3,m:6})]},
    {l:'Lo lasci in cima all\'ometto più vicino',min:3,out:[O(1,'g',`Un regalo per chi passa.`,{m:4})]}]},
{id:'mappavecchia',w:()=>1.2,title:'La mappa vecchia',
 text:`Un signore con una mappa ingiallita ti consiglia una variante «molto più breve».`,
 o:[{l:'Segui il consiglio',out:[O(1,'g',`Aveva ragione: quaranta minuti risparmiati.`,{min:-40}),O(2,'b',`La variante non esiste più da vent'anni.`,{min:50,e:-10,m:-6})]},
    {l:'Ringrazi e resti sul sentiero',out:[O(1,'m',`Prudenza.`)]},
    {l:'Controlli sulla tua mappa',req:()=>(att('orientamento')>=1),min:5,out:[O(1,'g',`La variante è segnata come chiusa. Grazie, ma no.`,{xp:2})]}]},
{id:'pausainterrotta',when:()=>S.wx==='nuvole',w:()=>1.5,title:'La pausa perfetta',
 text:`Ti sei appena tolto le scarpe sul prato più bello della giornata. Due gocce. Poi altre dieci.`,
 o:[{l:'Rimetti tutto in fretta e riparti',min:5,out:[O(1,'m',`Addio pausa.`,{m:-3})]},
    {l:'Resisti: magari passa',min:15,out:[O(1,'g',`Passa. La pausa continua.`,{m:6,e:5}),O(1,'b',`Non passa. Scarpe e calze bagnate.`,{add:['bagnati'],m:-6})]}]},
{id:'schiena',when:()=>packKg()>10,w:()=>2.5,title:'La schiena',
 text:`Un dolore sordo in fondo alla schiena. Lo zaino pesa davvero troppo.`,
 o:[{l:'Allunghi la schiena per cinque minuti',min:5,out:[O(1,'g',`Le vertebre ringraziano.`,{e:3})]},
    {l:'Ridistribuisci il peso: il pesante in alto e vicino alla schiena',min:10,out:[O(2,'g',`Va molto meglio.`,{flag:'zaino'}),O(1,'m',`Va un po' meglio.`)]},
    {l:'Stringi i denti',out:[O(1,'b',`Il dolore cresce col passare delle ore.`,{m:-6,e:-4})]}]},
{id:'polvereocchi',when:()=>S.wx==='vento'||S.wx==='sole',w:()=>1.5,title:'Polvere negli occhi',
 text:`Una raffica alza polvere e sabbia. Qualcosa ti è entrato in un occhio.`,
 o:[{l:'Lo sciacqui con l\'acqua della borraccia',min:5,out:[O(2,'g',`Via.`),O(1,'m',`Ci vuole un po', ma passa.`,{min:10})]},
    {l:'Lo strofini',out:[O(1,'b',`Peggio. Occhio rosso e lacrimante per un'ora.`,{m:-5})]}]},
{id:'sabbia',ter:['lago'],w:()=>2,title:'La spiaggia',
 text:`Il sentiero corre su una lunga spiaggia di sabbia lungo il lago. Ogni passo affonda.`,
 o:[{l:'Cammini sul bagnasciuga, dove è dura',out:[O(2,'g',`Molto meglio.`),O(1,'b',`Un'onda ti prende in pieno le scarpe.`,{add:['bagnati']})]},
    {l:'Ti togli le scarpe e cammini scalzo',min:10,out:[O(1,'g',`Sabbia fresca sotto i piedi. Vacanza vera.`,{m:8})]},
    {l:'Tiri dritto nella sabbia',out:[O(1,'m',`Fatica doppia.`,{e:-6})]}]},
{id:'sassipiatti',ter:['lago'],w:()=>1.5,title:'Rimbalzi',
 text:`Riva liscia, acqua piatta, e sassi piatti perfetti ovunque.`,
 o:[{l:'Lanci qualche sasso',min:10,out:[O(2,'g',`Sette rimbalzi. Record personale.`,{m:7}),O(1,'m',`Plof. Plof. Plof.`,{m:3})]},
    {l:'Prosegui',out:[O(1,'m',`Il bambino che è in te protesta.`)]}]},
{id:'drone',w:()=>1,title:'Il drone',
 text:`Un drone ronza sopra la valle, avanti e indietro, rompendo il silenzio.`,
 o:[{l:'Lo ignori',out:[O(1,'m',`Ronza ancora per un po'.`,{m:-2})]},
    {l:'Saluti la telecamera',out:[O(1,'g',`Il drone fa un inchino. Il pilota ha senso dell'umorismo.`,{m:4})]}]},
{id:'scritta',when:()=>S.morale<60,w:()=>2,title:'La scritta',
 text:`Su un sasso, qualcuno ha scritto col gesso: «Ce la stai facendo».`,
 o:[{l:'Ti fermi a leggerla due volte',out:[O(1,'g',`Proprio quello che serviva.`,{m:8})]},
    {l:'Aggiungi sotto: «Anche tu»',min:3,out:[O(1,'g',`Per chi viene dopo.`,{m:9})]}]},
{id:'coda',when:()=>S.clock>600&&S.clock<900,w:()=>1.5,title:'La coda',
 text:`Al passaggio stretto c'è la coda: un gruppo numeroso passa una persona alla volta.`,
 o:[{l:'Aspetti il tuo turno',min:25,out:[O(1,'m',`Venticinque minuti fermo.`,{e:3})]},
    {l:'Chiedi di passare avanti',out:[O(1,'g',`Ti fanno passare.`,{m:1}),O(1,'b',`Ti guardano male. Aspetti comunque.`,{min:25,m:-4})]},
    {l:'Cerchi un passaggio alternativo',min:15,out:[O(1,'g',`Un giro corto sopra le rocce.`,{xp:2}),O(1,'b',`Non c'è.`,{min:25,e:-4})]}]},
{id:'telefonobagnato',when:()=>S.wx==='pioggia'&&inv('batteria')>0,w:()=>2,title:'Il telefono bagnato',
 text:`Il telefono nella tasca della giacca è umido. Lo schermo fa cose strane.`,
 o:[{l:'Lo asciughi e lo metti in un sacchetto',min:5,out:[O(2,'g',`Salvo.`),O(1,'m',`Funziona, ma la batteria è scesa a picco.`,{give:{batteria:-25}})]},
    {l:'Speri che asciughi da solo',out:[O(1,'g',`Regge.`),O(1,'b',`Si spegne. Si riaccenderà, forse, al rifugio.`,{give:{batteria:-60},m:-5})]}]},
{id:'fragoline',ter:['betulle','valle'],when:()=>S.wx!=='pioggia',w:()=>1.5,title:'Fragoline',
 text:`Un bordo del sentiero è pieno di fragoline selvatiche, rosse e minuscole.`,
 o:[{l:'Ne raccogli una manciata',min:10,out:[O(1,'g',`Il sapore dell'estate in un boccone.`,{m:6,e:2})]},
    {l:'Ne mangi due al volo',out:[O(1,'g',`Perfette.`,{m:2})]}]},

 o:[{l:'Rallenti e immagini chi è passato prima',min:10,out:[O(2,'g',`Pastori, mercanti, pellegrini. Ti senti parte di qualcosa.`,{m:7}),O(1,'m',`Le pietre sono anche scivolose.`,{m:3,e:-2})]},
    {l:'Cammini svelto',out:[O(2,'g',`Il lastricato è veloce.`,{min:-5}),O(1,'b',`Una pietra traballa: caviglia piegata.`,{add:['storta']})]}]},
{id:'riparoRoccia',when:()=>S.wx==='pioggia',w:()=>2,title:'Il tetto di roccia',
 text:`Una roccia sporgente forma un riparo perfetto. Fuori, la pioggia picchia.`,
 o:[{l:'Ti fermi finché smette',min:40,out:[O(2,'g',`Smette davvero. Riparti asciutto.`,{e:6,m:3}),O(2,'m',`Non smette. Hai solo riposato.`,{e:6}),O(1,'b',`Arriva altra gente: un'ora pigiati come sardine.`,{min:20,m:-3})]},
    {l:'Dieci minuti e via',min:10,out:[O(2,'m',`Breve tregua.`,{e:3}),O(1,'g',`Proprio in quei dieci minuti spiove.`,{m:4})]}]},
{id:'bacche',ter:['betulle','valle'],w:()=>1.5,title:'Bacche sconosciute',
 text:`Bacche rosse e lucide, tantissime. Non sai cosa siano.`,
 o:[{l:'Ne assaggi una',out:[O(2,'m',`Acide da far lacrimare. Innocue, sembra.`,{m:1}),O(1,'b',`Amare. Lo stomaco protesta.`,{later:{segs:1,txt:'Quella bacca non era una buona idea.',fx:{add:['malessere']}}}),O(1,'g',`Dolci! Ne mangi una manciata.`,{m:4,e:3})]},
    {l:'Le lasci stare',out:[O(1,'g',`La prudenza in montagna non è mai sprecata.`),O(1,'m',`La curiosità ti rode per un'ora.`,{m:-1})]}]},
{id:'piviere',ter:['altopiano','torbiera'],w:()=>1.5,title:'L\'uccello ferito',
 text:`Un uccello trascina un'ala davanti a te, come se fosse ferito, e si allontana piano.`,
 o:[{l:'Lo segui per aiutarlo',min:15,out:[O(2,'m',`Appena lontano, vola via sanissimo. Era una finta per proteggere il nido.`,{m:3,xp:2}),O(1,'b',`Lo segui fuori dal sentiero e ti perdi un po'.`,{min:15,m:-3})]},
    {l:'Capisci il trucco e resti sul sentiero',out:[O(2,'g',`Il nido è salvo, e tu hai imparato qualcosa.`,{xp:3,m:3}),O(1,'g',`Ti accorgi del nido a un passo dal piede.`,{m:5})]}]},
{id:'nevischio',when:()=>S.wx==='vento'||S.wx==='nuvole',w:()=>1.5,title:'Nevischio a luglio',
 text:`Il cielo si fa bianco e arriva un nevischio sottile, in piena estate.`,
 o:[{l:'Ti copri bene e ti godi lo spettacolo',req:()=>(att('calore')>=1)||(att('impermeabile')>=1),out:[O(3,'g',`Neve a luglio. Da raccontare.`,{m:6,timbro:'Neve a luglio'}),O(1,'m',`Bello, ma ti entra ovunque.`,{m:1})]},
    {l:'Acceleri',out:[O(1,'m',`Passa in fretta.`,{e:-5}),O(1,'b',`Ti bagna e ti gela.`,{add:['freddo'],e:-5})]}]},
{id:'brezza',when:()=>S.wx==='sole'||S.wx==='nuvole',w:()=>1.5,title:'La brezza',
 text:`Una brezza fresca arriva dal lago. Il caldo sparisce, gli insetti anche.`,
 o:[{l:'Ne approfitti per allungare il passo',min:-10,out:[O(2,'g',`Chilometri leggeri.`,{e:-2}),O(1,'m',`La brezza cala dopo dieci minuti.`,{e:-4})]},
    {l:'Ti fermi a respirarla',min:5,out:[O(2,'g',`Aria pulita fino in fondo ai polmoni.`,{m:5}),O(1,'g',`Ti asciuga anche la maglia.`,{m:4,rm:['bagnati']})]}]},
{id:'tuonoPaura',w:()=>S.wx==='pioggia'?2:0.8,title:'Paura del tuono',
 text:`Un'escursionista è immobile sotto un tuono lontano, paralizzata dalla paura dei temporali.`,
 o:[{l:'Le parli con calma e la accompagni',min:25,out:[O(3,'g',`Respira, si calma, riprendete insieme.`,{xp:7,m:7}),O(1,'m',`Si calma solo quando il tuono smette.`,{xp:4,min:15})]},
    {l:'Le spieghi la regola dei secondi tra lampo e tuono',min:5,out:[O(2,'g',`«È a dieci chilometri». La paura scende.`,{xp:4,m:4}),O(1,'b',`Il lampo successivo è vicinissimo. Paura per entrambi.`,{m:-5})]}]},
{id:'pioggiaPerfetta',when:()=>S.wx==='pioggia',w:()=>1.2,title:'Tempismo',
 text:`Inizia a piovere forte. C'è una capanna a duecento metri.`,
 o:[{l:'Corri alla capanna',out:[O(2,'g',`Arrivi alla porta un secondo prima del diluvio. Applausi da dentro.`,{m:6,e:-4}),O(1,'b',`Arrivi fradicio. Smette appena entri.`,{add:['bagnati'],m:-4})]},
    {l:'Guscio e calma',req:()=>(att('impermeabile')>=1),out:[O(2,'g',`Asciutto e senza correre.`),O(1,'m',`Le gambe si bagnano comunque.`,{add:['bagnati']})]}]},
{id:'foglie',ter:['betulle'],when:()=>S.wx==='pioggia'||S.wx==='nuvole',w:()=>2,title:'Foglie scivolose',
 text:`Una coperta di foglie bagnate nasconde sassi e radici.`,
 o:[{l:'Tastare ogni passo',min:10,out:[O(3,'g',`Lento e sicuro.`),O(1,'m',`Una scivolata controllata.`,{m:-1})]},
    {l:'Passo normale',out:[O(()=>(att('appoggio')>=1)?3:2,'g',`Va.`),O(2,'b',`Gambe all'aria.`,{e:-6,m:-4}),O(1,'b',`La caviglia si gira sotto le foglie.`,{add:['storta']})]}]},
{id:'pietreSuonano',ter:['altopiano','gola'],w:()=>1,title:'Le pietre che suonano',
 text:`Alcune lastre di roccia, colpite, suonano come campane.`,
 o:[{l:'Suoni una melodia',min:10,out:[O(2,'g',`Il primo concerto di pietra della tua vita.`,{m:8,timbro:'Musica di pietra'}),O(1,'m',`Ti martelli un dito.`,{m:2})]},
    {l:'Ascolti qualcuno che suona',min:5,out:[O(1,'g',`Un bambino batte il ritmo. Magia.`,{m:5}),O(1,'m',`Nessuno suona. Solo il vento.`)]}]},
{id:'animaleCurioso',w:()=>1.5,title:'Lo sguardo',
 text:`Un animale ti fissa da un masso: una lepre, immobile, le orecchie dritte.`,
 o:[{l:'Resti immobile anche tu',min:5,out:[O(2,'g',`Gara di sguardi. Vince lei.`,{m:6}),O(1,'g',`Si avvicina di due salti. Incredibile.`,{m:9}),O(1,'m',`Scappa subito.`,{m:1})]},
    {l:'Prosegui piano',out:[O(1,'m',`Ti guarda passare.`,{m:2}),O(1,'g',`Ti segue con gli occhi fino alla curva.`,{m:3})]}]},
{id:'muschioPozza',ter:['torbiera','betulle','valle'],w:()=>2,title:'Il muschio traditore',
 text:`Un tappeto di muschio verde brillante, morbidissimo. Troppo verde.`,
 o:[{l:'Ci passi sopra',out:[O(1,'g',`Morbido e asciutto.`),O(2,'b',`Sotto c'è acqua. Gamba dentro fino al polpaccio.`,{add:['bagnati'],m:-3})]},
    {l:'Lo aggiri sui sassi',min:8,out:[O(3,'g',`Il verde troppo verde non ti frega.`),O(1,'m',`I sassi sono scivolosi.`,{e:-3})]}]},
{id:'caffeRovesciato',when:()=>(att('cucina')>=1)&&inv('gas')>0,w:()=>1.2,title:'Il caffè',
 text:`Il pentolino bolle, il caffè è quasi pronto. Il fornelletto è su un sasso un po' storto.`,
 o:[{l:'Lo bevi subito',use:{gas:1},min:10,out:[O(3,'g',`Caffè di montagna, il migliore.`,{m:6,e:3}),O(1,'b',`Il pentolino si ribalta. Caffè sul sasso, gas sprecato.`,{m:-5})]},
    {l:'Sposti tutto su un posto più piano',use:{gas:1},min:15,out:[O(1,'g',`Prudenza premiata.`,{m:5,e:3}),O(1,'m',`Mentre sposti, il vento spegne la fiamma.`,{m:-1})]}]},
{id:'zipBloccata',when:()=>(att('impermeabile')>=1)&&(S.wx==='pioggia'||S.wx==='vento'),w:()=>1.5,title:'La cerniera bloccata',
 text:`La cerniera del guscio si è incastrata a metà. Mezzo petto è esposto alla pioggia.`,
 o:[{l:'Ci lavori con pazienza',min:10,out:[O(2,'g',`Si sblocca.`),O(1,'b',`Si rompe il cursore.`,{m:-4,add:['freddo']})]},
    {l:'La forzi',out:[O(1,'g',`Sbloccata.`),O(2,'b',`Rotta. Usi una spilla del kit come puoi.`,{m:-3})]},
    {l:'Lo indossi così',out:[O(1,'m',`Mezzo bagnato.`,{m:-2}),O(1,'b',`Bagnato del tutto.`,{add:['freddo'],m:-4})]}]},
{id:'passaggioAuto',ter:['valle','lago'],w:()=>1,title:'Il passaggio',
 text:`Il sentiero costeggia per tre chilometri una strada sterrata. Un'auto rallenta: ti offrono un passaggio.`,
 o:[{l:'Accetti',min:-50,out:[O(2,'m',`Comodo. Ma quei tre chilometri non li hai camminati.`,{m:-2,e:4}),O(1,'g',`Sono custodi del rifugio. Ti tengono un letto.`,{e:4,mem:'coppia'})]},
    {l:'Ringrazi e cammini',out:[O(2,'g',`Ogni metro a piedi. Orgoglio.`,{m:4}),O(1,'m',`La strada è noiosa e polverosa.`,{m:-2})]}]},
{id:'offertaPonte',w:()=>1,title:'La cassetta del ponte',
 text:`Accanto a un ponte nuovo, una cassetta: «Offerta libera per la manutenzione dei sentieri».`,
 o:[{l:'Lasci 5 euro',out:[O(3,'g',`Ponti nuovi per chi verrà dopo.`,{s:-5,m:4}),O(1,'g',`Un volontario lì vicino ti ringrazia e ti offre un caffè.`,{s:-5,m:6,e:3})]},
    {l:'Passi senza lasciare niente',out:[O(2,'m',`Il ponte regge lo stesso.`),O(1,'b',`Il volontario lì accanto ti guarda.`,{m:-3})]}]},
{id:'panchina',w:()=>1.2,title:'La panchina',
 text:`Una panchina di legno in un punto panoramico. Sopra, una targhetta: «A Marta, che amava questa vista».`,
 o:[{l:'Ti siedi un po\'',min:10,out:[O(3,'g',`Capisci perché Marta l'amava.`,{m:7,e:3}),O(1,'m',`Ti viene un nodo alla gola.`,{m:2,e:3})]},
    {l:'Un saluto silenzioso e prosegui',out:[O(1,'g',`Grazie, Marta.`,{m:3}),O(1,'m',`Ci ripensi a lungo.`,{m:1})]}]},
{id:'fischietto',w:()=>1,title:'Tre fischi',
 text:`Tre fischi, una pausa, tre fischi. Il segnale di soccorso. Viene da una valle laterale.`,
 o:[{l:'Vai a vedere',min:40,out:[O(2,'m',`Sono due bambini che giocano col fischietto del papà. Glielo spieghi.`,{xp:3,e:-6}),O(1,'g',`Un escursionista con la caviglia rotta. Lo aiuti e chiami i soccorsi.`,{xp:15,m:10,e:-8,timbro:'Hai risposto ai tre fischi'})]},
    {l:'Lo segnali al rifugio',req:()=>inv('batteria')>=5,min:5,out:[O(2,'g',`Il custode manda qualcuno.`,{xp:5,give:{batteria:-5}}),O(1,'m',`Non c'è campo. Riprovi più avanti.`,{min:10})]},
    {l:'Probabilmente sono bambini',out:[O(2,'m',`Probabilmente.`,{m:-4}),O(1,'b',`Il dubbio ti tormenta tutto il giorno.`,{m:-8})]}]},
{id:'pernice',w:()=>1.5,title:'L\'esplosione',
 text:`Da un cespuglio a un passo da te esplode in volo una pernice, con un frullo assordante.`,
 o:[{l:'Urli',out:[O(2,'m',`Lei vola via, tu ridi dello spavento.`,{m:3}),O(1,'b',`Fai un salto indietro e cadi seduto.`,{e:-4,m:-2})]},
    {l:'Resti di sasso',out:[O(1,'g',`Il cuore riparte dopo qualche secondo.`,{m:2}),O(1,'g',`Ne volano altre quattro. Una famiglia intera.`,{m:6})]}]},
{id:'placche',ter:['gola','altopiano'],w:()=>2,title:'Le placche lisce',
 text:()=>`Il sentiero passa su grandi lastre di roccia liscia${S.wx==='pioggia'?', lucide di pioggia':''}.`,
 o:[{l:'Piedi piatti e baricentro basso',min:10,out:[O(()=>S.wx==='pioggia'?2:5,'g',`Aderenza perfetta.`),O(()=>S.wx==='pioggia'?2:1,'b',`Scivoli di un metro e ti fermi su una crepa.`,{m:-6})]},
    {l:'Le aggiri sul bordo erboso',min:15,out:[O(3,'g',`Più lungo, più sicuro.`),O(1,'m',`Il bordo è ripido e franoso.`,{e:-4})]}]},
{id:'teleferica',w:()=>1,title:'La vecchia teleferica',
 text:`I resti di una teleferica abbandonata: un pilone arrugginito, un vagoncino fermo da decenni.`,
 o:[{l:'Ti fermi a esplorare',min:20,out:[O(2,'g',`Nel vagoncino, una scritta del 1962.`,{m:6,timbro:'La teleferica dimenticata'}),O(1,'b',`Ti tagli su una lamiera arrugginita.`,{m:-5})]},
    {l:'La guardi da lontano',out:[O(1,'m',`Ruggine e silenzio.`,{m:1}),O(1,'g',`Un falco ha fatto il nido sul pilone.`,{m:4})]}]},
{id:'meditazione',w:()=>1,title:'Il silenzio degli altri',
 text:`Un gruppo è seduto in cerchio in silenzio, occhi chiusi, in un punto panoramico.`,
 o:[{l:'Ti siedi poco lontano, in silenzio anche tu',min:15,out:[O(2,'g',`Il quarto d'ora più calmo del viaggio.`,{m:8,e:3}),O(1,'m',`Il tuo stomaco brontola fortissimo.`,{m:2})]},
    {l:'Passi piano senza disturbare',out:[O(1,'g',`Uno ti sorride senza aprire gli occhi.`,{m:3}),O(1,'b',`Il sassolino che calci rotola rumoroso fino a loro.`,{m:-2})]}]},
{id:'pittore',w:()=>1,title:'Il pittore',
 text:`Un uomo anziano dipinge ad acquerello davanti al panorama, cavalletto piantato tra i sassi.`,
 o:[{l:'Ti fermi a guardarlo lavorare',min:20,out:[O(2,'g',`Ti spiega come dipingere la luce. Ti regala uno schizzo.`,{m:9,timbro:'Lo schizzo del pittore'}),O(1,'m',`Non ama essere guardato. Te ne vai.`,{m:-1})]},
    {l:'Un complimento e via',out:[O(1,'g',`Sorride.`,{m:3}),O(1,'m',`Non ti sente. È concentratissimo.`)]}]},
{id:'carcassa',when:()=>!(att('acquaSicura')>=1),w:()=>1.5,title:'Qualcosa nel torrente',
 text:`Risalendo il torrente dove avevi bevuto un'ora fa, trovi una carcassa nell'acqua.`,
 o:[{l:'Speri sia andata bene',out:[O(2,'m',`Lo stomaco tiene. Ti è andata bene.`,{m:-3}),O(1,'b',`Lo stomaco non tiene.`,{later:{segs:1,txt:'L\'acqua di quel torrente ti presenta il conto.',fx:{add:['malessere'],e:-10}}})]},
    {l:'Da ora bevi solo dalle sorgenti',out:[O(1,'g',`Lezione imparata.`,{xp:3}),O(1,'m',`Le sorgenti sono poche: un po' di sete.`,{e:-4})]}]},
{id:'filoSpinato',w:()=>1,title:'Il filo spinato',
 text:`Vecchio filo spinato arrugginito, mezzo nascosto nell'erba lungo il sentiero.`,
 o:[{l:'Lo segnali spostandolo di lato con un bastone',min:10,out:[O(2,'g',`Nessuno ci inciamperà più.`,{xp:4,m:4}),O(1,'b',`Ti graffia la mano.`,{m:-4})]},
    {l:'Lo scavalchi con attenzione',out:[O(3,'g',`Passato.`),O(1,'b',`Ti strappa i pantaloni e la pelle.`,{m:-5})]}]},
{id:'valangaSassi',ter:['gola','altopiano'],w:()=>1.5,title:'Sassi che partono',
 text:`Un sasso ti scivola sotto il piede e rotola giù. Sotto, sul sentiero, ci sono delle persone.`,
 o:[{l:'Urli «Sasso!»',out:[O(3,'g',`Si spostano in tempo. Ti ringraziano dell'avviso.`,{m:2,xp:2}),O(1,'b',`Il sasso passa vicinissimo a loro. Ti guardano malissimo.`,{m:-8})]},
    {l:'Resti zitto sperando che si fermi',out:[O(2,'m',`Si ferma in un cespuglio. Respiri.`,{m:-2}),O(1,'b',`Non si ferma. Grida, paura, nessun ferito. Per fortuna.`,{m:-12})]}]},
{id:'pontePortato',w:()=>1,title:'Il ponte che non c\'è',
 text:`Del ponte restano solo i due appoggi. La piena di primavera se l'è portato via.`,
 o:[{l:'Guadi',out:[O(()=>(att('appoggio')>=1)?3:1,'m',`Passi, bagnato.`,{add:['bagnati']}),O(1,'b',`Corrente più forte del previsto.`,{add:['bagnati','freddo'],e:-8})]},
    {l:'Sandali',req:()=>(att('guado')>=1),min:15,out:[O(1,'g',`Scarpe asciutte.`),O(1,'m',`Freddissimo, ma asciutto.`,{m:-1})]},
    {l:'Cerchi un altro passaggio a monte',min:40,out:[O(2,'g',`Lo trovi.`,{e:-6}),O(1,'b',`Non c'è.`,{min:20,add:['bagnati'],e:-8})]}]},
{id:'birraTorrente',w:()=>0.8,title:'La birra nel torrente',
 text:`In una pozza del torrente, legate con uno spago, rinfrescano sei birre. Nessuno in vista.`,
 o:[{l:'Le lasci al loro proprietario',out:[O(2,'g',`Rispetto.`,{m:2}),O(1,'g',`Il proprietario sbuca dal bosco e te ne offre una.`,{m:8})]},
    {l:'Ne prendi una e lasci due euro sotto un sasso',out:[O(2,'g',`La birra più fresca della tua vita.`,{s:-2,m:8}),O(1,'b',`Il proprietario arriva proprio mentre la apri.`,{s:-2,m:-4})]}]},
{id:'capelliElettrici',ter:['altopiano'],when:()=>S.wx==='pioggia'||S.wx==='vento',w:()=>1.5,title:'I capelli si rizzano',
 text:`Senti un ronzio e i capelli ti si rizzano in testa. L'aria è carica di elettricità.`,
 o:[{l:'Scendi subito di quota, di corsa',min:-5,out:[O(3,'g',`Il fulmine cade sulla cresta che hai appena lasciato.`,{e:-10,m:-4}),O(1,'b',`Inciampi correndo giù.`,{e:-10,add:['storta']})]},
    {l:'Ti accovacci lontano dai bastoncini',min:20,out:[O(2,'m',`Il temporale passa sopra di te. Lunghi minuti.`,{m:-8}),O(1,'g',`Passa di lato. Ti rialzi tremando.`,{m:-3})]}]},
{id:'zainoAppeso',w:()=>1,title:'Lo zaino appeso',
 text:`Uno zaino appeso a un ramo, a bordo sentiero. Il proprietario è in giro, probabilmente.`,
 o:[{l:'Non lo tocchi',out:[O(2,'g',`Giusto così.`,{m:1}),O(1,'g',`Più avanti incroci il proprietario che torna. Ti saluta.`,{m:3})]},
    {l:'Lasci un biglietto: «Attenzione ai corvi»',min:3,out:[O(1,'g',`Un consiglio utile.`,{m:3}),O(1,'m',`Un corvo ti osserva mentre scrivi.`,{m:2})]}]},
{id:'duecolori',w:()=>1.5,title:'Due colori',
 text:`I segnavia si dividono: rossi a sinistra, blu a destra. La mappa parla solo di quelli rossi.`,
 o:[{l:'Segui i rossi',out:[O(3,'g',`Giusto.`),O(1,'m',`I rossi fanno un giro più lungo.`,{min:15})]},
    {l:'Prova i blu',out:[O(1,'g',`Una variante più panoramica.`,{m:6}),O(2,'b',`I blu portano a un alpeggio e basta. Torni indietro.`,{min:40,e:-6,m:-4})]}]},
{id:'menu',when:()=>S.seg>=4,w:()=>1.2,title:'Il menu della sera',
 text:`Un cartello in legno annuncia: «Stasera al rifugio: zuppa di salmerino e torta. Posti limitati».`,
 o:[{l:'Acceleri per prenotare',min:-20,out:[O(2,'g',`Arriverai in tempo.`,{e:-8,mem:'zuppa'}),O(1,'b',`Corri per niente: era il menu di ieri.`,{e:-8,m:-3})]},
    {l:'Arriverà chi arriverà',out:[O(1,'m',`Speri ne resti un po'.`),O(1,'g',`Ti viene fame solo a pensarci.`,{m:2})]}]},
{id:'salitaFinale',when:()=>S.seg>=5,w:()=>2,title:'L\'ultima salita',
 text:`Il rifugio è là sopra. Cento metri di dislivello, alla fine di tutto.`,
 o:[{l:'Su senza fermarti',out:[O(2,'g',`Arrivi in cima stremato e fiero.`,{e:-8,m:6}),O(1,'b',`A metà le gambe dicono basta. Ti fermi comunque.`,{e:-10,min:10})]},
    {l:'A tappe, con tre pause',min:15,out:[O(3,'g',`Ci arrivi intero.`,{e:-5}),O(1,'m',`Ogni pausa è più difficile ripartire.`,{e:-6,m:-2})]}]},
{id:'eriofori',ter:['torbiera','valle'],w:()=>1.5,title:'Il prato di cotone',
 text:`Un prato intero di eriofori, ciuffi bianchi di cotone che tremano al vento.`,
 o:[{l:'Ti fermi a guardarlo',min:10,out:[O(3,'g',`Sembra neve d'estate.`,{m:7}),O(1,'m',`Bellissimo. E paludoso.`,{m:4,add:['bagnati']})]},
    {l:'Lo attraversi',out:[O(1,'b',`Sotto il cotone c'è la torba.`,{add:['bagnati']}),O(1,'g',`Asciutto, per una volta.`,{m:3})]}]},
{id:'fohn',when:()=>S.wx==='vento',w:()=>1.5,title:'Il vento caldo',
 text:`Il vento cambia: ora è caldo e secco, arriva dalle montagne e ti asciuga tutto.`,
 o:[{l:'Ti togli il guscio e lasci asciugare tutto',min:5,out:[O(3,'g',`In mezz'ora sei asciutto da capo a piedi.`,{rm:['bagnati','freddo'],m:4}),O(1,'m',`Ti secca anche le labbra.`,{rm:['bagnati'],m:1})]},
    {l:'Ne approfitti per accelerare',min:-10,out:[O(1,'g',`Il vento ti spinge.`,{e:-3}),O(1,'m',`Il vento caldo stanca.`,{e:-6})]}]},
{id:'compagnoSilenzio',w:()=>1.2,title:'Il compagno silenzioso',
 text:`Un uomo cammina al tuo passo, a qualche metro. Non parla. Non sembra volerlo.`,

const wv=w=>typeof w==='function'?w():w;
function opts(ev){return ev.o.filter(op=>!op.when||op.when())}
function riskOf(op){let t=0,b=0;op.out.forEach(x=>{const w=Math.max(0,wv(x.w));t+=w;if(x.t==='b')b+=w;else if(x.t==='m')b+=w*0.35});const p=t?b/t:0;
 if(op.out.length<2||p<0.08)return null;return p<0.25?['Rischio basso','r0']:p<0.5?['Rischio medio','r1']:['Rischio alto','r2']}
function speed(){let v=2.4;const kg=packKg();v-=Math.max(0,kg-9)*0.12;
 v+=0.15*att('asciugatura')-0.05*att('caviglia')+0.075*att('appoggio');
 if(S.energia<30)v*=0.75;if(S.stati.has('vesciche'))v*=0.85;if(S.stati.has('storta'))v*=1-0.2/(1+att('caviglia')*0.3);if(S.stati.has('ginocchio'))v*=0.88;if(S.stati.has('bagnati'))v*=0.95;if(S.flags.zaino)v+=0.1;
 return Math.max(1.4,v)}
function energyCost(km){let c=km*(2.5+Math.max(0,packKg()-7)*(0.3-0.045*att('portanza')));c*=1+0.15*(S.fame||0);if(typeof H!=='undefined'&&H)c*=(1.35-0.6*H.forma/100)*(1-0.05*H.abil.resistenza);
 c*=1-0.06*att('appoggio');if(S.stati.has('vesciche'))c*=1.15;if(S.stati.has('malessere'))c*=1.2;if(S.stati.has('freddo'))c*=1.1;if(S.stati.has('scottato'))c*=1.05;return c}
/* effetti passivi a ogni tratto, graduati sulle caratteristiche dell'equipaggiamento */
function passive(){const m0=S.morale;const N=passiveCore();if(typeof H!=='undefined'&&H&&S.morale<m0)S.morale=clamp(m0-(m0-S.morale)*(1-0.08*H.abil.adattamento),0,100);return N}
function passiveCore(){const N=[];const imp=att('impermeabile'),cal=att('calore'),av=att('antivento');
 if(S.wx==='pioggia'){
  S.morale-=Math.max(1,6-2*imp);if(imp<1){N.push('La pioggia ti entra nelle ossa.');if(chance(0.5))S.stati.add('freddo')}
  if(!S.stati.has('bagnati')){let p=0.45*(1-0.22*att('piediAsciutti'))*(S.mese==='giugno'?1.2:1);if(att('fango')>=2)p*=0.35;if(chance(p)){S.stati.add('bagnati');N.push('L\'acqua è arrivata ai calzini.')}}
 }else if(S.stati.has('bagnati')&&chance([0.05,0.1,0.25,0.45][att('asciugatura')])){S.stati.delete('bagnati');N.push('Le scarpe si sono asciugate camminando.')}
 if((S.wx==='sole'||S.wx==='nuvole')&&!S.flags.repel){const ins=att('antinsetti'),mi=MESI[S.mese].insetti;if(ins<3){S.morale-=Math.max(0,4-ins*1.5)*mi;if(ins<2&&mi>0.5)N.push('Le zanzare non ti mollano.')}}
 if(S.mese==='settembre'&&(S.wx==='vento'||S.wx==='nebbia'||S.clock>1080)&&att('calore')<1&&chance(0.25))S.stati.add('freddo');
 if(has('orologio')&&S.bat.orologio>0){S.bat.orologio=Math.max(0,S.bat.orologio-4);if(S.bat.orologio===0)N.push('L\'orologio GPS si è spento: batteria finita.')}
 if(has('faro')&&S.bat.faro>0){S.bat.faro=Math.max(0,S.bat.faro-2);if(S.bat.faro===0)N.push('Il faro satellitare si è spento.')}
 S.inv.batteria=Math.max(0,inv('batteria')-1);
 if(S.wx==='sole'&&S.clock>720&&!S.stati.has('scottato')&&chance(0.15*(1-0.4*att('ombra')))){S.stati.add('scottato');N.push('Il sole ti ha bruciato il collo.')}
 if(S.wx==='vento'&&av<2){S.morale-=3-av;if(chance(0.3-0.1*av))S.stati.add('freddo')}
 if(S.stati.has('freddo')){S.morale-=3;if(chance(0.25*cal)){S.stati.delete('freddo');N.push('Gli strati caldi ti rimettono in temperatura.')}}
 if(S.stati.has('vesciche'))S.morale-=4;
 if(S.fame>=2){S.morale-=S.fame;if(chance(0.4))N.push(S.fame>=3?'La fame ti svuota: ogni passo costa il doppio.':'Lo stomaco brontola. Le gambe sono più pesanti.')}
 if(att('portanza')<2&&packKg()>9){S.morale-=2;if(chance(0.3))N.push('Lo zaino senza telaio ti sega le spalle.')}
 if(S.wx==='sole')S.morale+=2;
 S.morale=clamp(S.morale-0.5,0,100);
 let hp=0.04+0.025*att('caviglia');if(S.flags.trucco)hp*=0.5;if(S.stati.has('bagnati'))hp*=3;if(packKg()>11)hp*=1.5;
 if(!S.stati.has('vesciche')&&!S.used.has('hotspot'+S.tappa)&&chance(hp))S.force='hotspot';
 return N}

/* =========== ATTREZZATURA: usura, qualità, marchi, negozio =========== */
function eqInit(){H.wear=H.wear||{};H.qual=H.qual||{};H.known=H.known||{};H.warr=H.warr||{};H.ordini=H.ordini||[];if(!H.stock)rollStock();

function cond(id){const it=ITEM_BY[id];if(!it||!it.dur||it.dur>=9999)return 1;const d=it.dur*(H.qual[id]==='difetto'?0.5:1);return Math.max(0,1-(H.wear[id]||0)/d)}

function effAttrs(id){const it=ITEM_BY[id];if(!it||!it.a)return {};let a={...it.a};const ks=Object.keys(a).sort((x,y)=>a[y]-a[x]);
 if(H.qual[id]==='difetto'&&ks[0])a[ks[0]]=Math.max(0,a[ks[0]]-1);if(H.qual[id]==='gioiello'&&ks[0])a[ks[0]]=Math.min(3,a[ks[0]]+1);

function rollStock(){H.stock=ITEMS.filter(i=>i.brand).filter(i=>i.brand==='S'||i.brand==='D'||(i.brand==='Sh'&&chance(0.7))||(i.brand==='A'&&chance(0.6))).map(i=>i.id)}

function buyItem(id){eqInit();const it=ITEM_BY[id];if(!it||H.owned.has(id)||H.soldi<price(id)||(it.lvl||0)>lvl())return;

 H.soldi-=price(id);
 if(it.brand==='D'){H.ordini.push({id,m:3});H.esitoNeg=`Ordinato: ${it.name}. Arriverà tra tre mesi.`}
 else{H.owned.add(id);H.wear[id]=0;delete H.warr[id];if(it.brand==='Sh'){const r=Math.random();H.qual[id]=r<0.18?'difetto':r<0.28?'gioiello':'normale';H.known[id]=false}
  H.esitoNeg=`Comprato: ${it.name}.`}
 save();render()}
function sellValue(id){const it=ITEM_BY[id];const base=itPrice(id)*(it&&it.brand==='A'?0.65:0.5);return Math.round(base*Math.max(0.15,cond(id)))}
function sellItem(id){eqInit();if(!H.owned.has(id))return;H.soldi+=sellValue(id);H.owned.delete(id);delete H.wear[id];H.esitoNeg=`Venduto: ${ITEM_BY[id]?ITEM_BY[id].name:id}.`;save();render()}
function repairCost(id){const it=ITEM_BY[id];return Math.max(5,Math.round(itPrice(id)*(it&&it.brand==='D'?0.15:0.3)))}
function repairItem(id){eqInit();const it=ITEM_BY[id];if(!it||!H.wear[id]||H.soldi<repairCost(id))return;H.soldi-=repairCost(id);H.wear[id]=Math.max(0,H.wear[id]-0.6*it.dur);H.esitoNeg=`Riparato: ${it.name}.`;save();render()}
function prepareTrek(){eqInit();S=newState();S.mese=SEASON[H.mese];S.kit=new Set();
 const best=list=>list.sort((x,y)=>(cond(y.id)>0)-(cond(x.id)>0)||itPrice(y.id)-itPrice(x.id))[0];
 for(const g of ['zaino','sacco','materassino','scarpe']){const own=ITEMS.filter(i=>i.group===g&&H.owned.has(i.id));if(own.length)S.kit.add(best(own).id)}
 const seen=new Set();ITEMS.filter(i=>!i.group&&H.owned.has(i.id)&&!['carte','faro','tenda','orologio'].includes(i.base||i.id)).sort((x,y)=>itPrice(y.id)-itPrice(x.id)).forEach(i=>{const b=i.base||i.id;if(!seen.has(b)&&cond(i.id)>0){seen.add(b);S.kit.add(i.id)}});
 S.eff={};H.owned.forEach(id=>S.eff[id]=effAttrs(id));
 for(const k in S.inv)if(k!=='batteria')S.inv[k]=Math.min(H.scorte[k]||0,{pasti:3,barrette:4,gas:4,cerotti:3,repellente:2,calze:1,powerbank:1}[k]);
 S.soldi=H.soldi;S.ferie=H.ferie;S.morale=startMorale();S.screen='zaino';H.screen=null;render()}
/* dopo il cammino: chilometri sugli oggetti, garanzia, qualità scoperta */
function wearAfterTrek(km){eqInit();const notes=[];
 S.kit.forEach(id=>{const it=ITEM_BY[id];if(!it||!it.dur||it.dur>=9999||!H.owned.has(id))return;const before=cond(id);H.wear[id]=(H.wear[id]||0)+km;const after=cond(id);
  if(it.brand==='Sh'&&!H.known[id]){H.known[id]=true;if(H.qual[id]==='difetto')notes.push(`${it.name}: era un esemplare difettoso, si consuma il doppio e rende meno.`);else if(H.qual[id]==='gioiello')notes.push(`${it.name}: ti è capitato un esemplare eccellente!`)}
  if(after<=0&&before>0){if(it.brand==='A'&&!H.warr[id]){H.wear[id]=0;H.warr[id]=true;notes.push(`${it.name} si è rotto: la garanzia Alvenheim lo sostituisce gratis.`)}else notes.push(`${it.name} è rotto: va riparato o ricomprato.`)}
  else if(condLabel(after)!==condLabel(before))notes.push(`${it.name} ora è ${condLabel(after)}.`)});
 return notes}
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
