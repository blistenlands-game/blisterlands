<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blisterlands</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEE3CA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blisterlands">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEE3CA; --paper2:#F5EDDC; --ink:#2E2620; --soft:#5C4E42; --faint:#8C7B6B;
  --rust:#7A3B1D; --rule:rgba(142,167,188,.38); --margin:rgba(196,124,105,.35);
  --lake:#3D5A6C; --ok:#5E6B3A; --danger:#9A3A22; --wear:rgba(112,82,44,.30);
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  box-sizing:border-box;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:28px;
 background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-attachment:local}
body::before{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 46px var(--wear);z-index:5}
body::after{content:"";position:fixed;width:74px;height:74px;right:18px;bottom:120px;border-radius:50%;border:5px solid rgba(138,90,43,.07);pointer-events:none;z-index:5}
main{position:relative;max-width:560px;overflow-x:clip;margin:0 auto;padding:16px 18px 48px 50px;min-height:100vh;
 background-image:linear-gradient(to right,transparent 33px,var(--margin) 33px,var(--margin) 34.5px,transparent 34.5px);background-repeat:repeat-y}
h1,h2,h3{margin:0;line-height:1.1}
h1{font-family:var(--hand);font-size:52px;font-weight:700}
h2{font-family:var(--hand);font-size:32px;font-weight:700}
h3{font-family:var(--hand);font-size:24px;font-weight:700;color:var(--rust);margin-top:10px}
.card h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:26px;margin-bottom:2px}
p{margin:0 0 4px}
.sub{color:var(--soft);font-size:15px;font-style:italic}
button{font:inherit;color:inherit}
.btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;text-align:left;background:var(--paper2);border:1.6px solid var(--ink);border-radius:4px 10px 5px 9px;box-shadow:2px 3px 0 rgba(46,38,32,.28);padding:9px 40px 9px 14px;margin:10px 0;min-height:58px;cursor:pointer;font-size:16px;line-height:24px;transition:transform .08s}
.btn::after{content:"\2192";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--hand);font-size:28px;font-weight:700;color:var(--rust)}
.btn:hover{background:#FBF4E4}
.btn:active{transform:translate(2px,2px);box-shadow:0 1px 0 rgba(46,38,32,.28)}
.btn:focus-visible,.qty button:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.btn[disabled]{background:transparent;border-style:dashed;border-color:var(--faint);box-shadow:none;color:var(--faint);cursor:not-allowed}
.btn[disabled]::after{content:"";}
.btn .meta{display:block;font-family:var(--hand);font-size:19px;line-height:22px;color:var(--soft);margin-top:2px}
.btn[disabled] .meta{color:var(--faint)}
.primary{align-items:center;text-align:center;padding:10px 40px;background:var(--rust);border-color:var(--rust);color:#FFF8EC;font-family:var(--hand);font-size:28px;font-weight:700;box-shadow:2px 3px 0 rgba(46,38,32,.4);transform:rotate(-.6deg)}
.primary::after{color:#FFF8EC}
.primary:hover{background:#8E4826}
.primary .meta{color:#F3DFC8!important}
.risk{font-family:var(--hand);font-weight:700;font-size:18px;margin-left:8px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.risk::before{content:"";display:inline-block;flex:none;height:10px;width:10px;background:radial-gradient(circle at 5px 5px,currentColor 3.8px,transparent 4.4px) 0 0/13px 10px repeat-x}
.r1::before{width:23px} .r2::before{width:36px}
.r0{color:var(--ok)} .r1{color:var(--rust)} .r2{color:var(--danger)}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 2px}
.stat{text-align:center}
.stat b{display:block;font-family:var(--hand);font-size:27px;line-height:1;font-weight:700}
.stat span{font-size:12px;color:var(--soft)}
.low b{color:var(--danger)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wx{font-family:var(--hand);font-size:22px;font-weight:700;color:var(--rust)}
.inv{font-family:var(--hand);font-size:18px;line-height:24px;color:var(--soft);margin:2px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tag{font-family:var(--hand);font-size:19px;font-weight:700;border:1.5px solid var(--danger);color:var(--danger);border-radius:50%;padding:0 12px;transform:rotate(-3deg)}
/* testata fissa della tappa e della sera */
main.flush{padding-top:0}
.hdr{position:sticky;top:0;z-index:6;margin:0 -18px 20px -50px;padding-top:env(safe-area-inset-top,0px);background:#F3EAD6;box-shadow:0 3px 6px rgba(70,50,30,.18)}
.hdr .pic{position:relative}
.hdr .scene{margin:0;overflow:hidden}
.ov-top{position:absolute;left:10px;top:8px;display:flex;flex-direction:column;background:rgba(243,234,214,.82);border-radius:4px 10px 6px 9px;padding:2px 10px 3px}
.ov-top h2{font-family:var(--hand);font-size:26px;line-height:28px;margin:0}
.ov-top span{font-size:13px;line-height:16px;font-style:italic;color:var(--soft)}
.ov-bot{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(243,234,214,.86);border-top:1.5px solid var(--ink);padding:2px 4px 3px}
.ostat{text-align:center;line-height:1}
.ostat b{display:block;font-family:var(--hand);font-size:23px;font-weight:700}
.ostat span{font-size:11px;color:var(--soft)}
.ostat.low b{color:var(--danger)}
.info{background:#E4D5B3;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:10px 16px 11px 18px;font-size:14px;line-height:20px;display:flex;flex-direction:column;gap:6px}
.irow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.irow.small{font-size:13px;line-height:19px;color:var(--soft);justify-content:flex-start;column-gap:12px;row-gap:2px}
.irow.small span{white-space:nowrap}
.info .wx{font-size:21px}
.info .tags{margin:0;gap:8px}
.info .tag{font-size:16px;padding:0 8px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0;padding:8px 0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);text-align:center}
.sum b{display:block;font-family:var(--hand);font-size:30px;line-height:1;font-weight:700;color:var(--rust)}
.sum span{font-size:12px;color:var(--soft)}
/* ritratti incollati sul taccuino */
.ritratto{float:right;margin:0 0 6px 12px;padding:4px 4px 2px;background:#F5EDDC;border:1.5px solid var(--ink);border-radius:2px;box-shadow:2px 3px 0 rgba(46,38,32,.22);transform:rotate(2.5deg);position:relative;text-align:center}
.ritratto::before{content:"";position:absolute;top:-8px;left:50%;width:34px;height:13px;margin-left:-17px;background:rgba(214,200,160,.85);border:1px solid rgba(46,38,32,.18);transform:rotate(-5deg)}
.ritratto svg{display:block}
.ritratto figcaption{font-family:var(--hand);font-size:18px;font-weight:700;line-height:1}
.ritratto.grande{float:none;display:block;width:max-content;margin:14px auto 12px;transform:rotate(-2deg);padding:8px 8px 4px}
.ritratto.grande figcaption{font-size:24px}
.card .btn{clear:both}
/* negozio */
.prod{position:relative;display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:start;padding:10px 4px 10px 2px;border-bottom:1.5px dashed var(--faint);line-height:20px}
.pthumb{background:#F5EDDC;border:1.5px solid var(--ink);border-radius:3px;box-shadow:2px 2px 0 rgba(46,38,32,.2);transform:rotate(-1.5deg);padding:2px}
.prod:nth-child(even) .pthumb{transform:rotate(1.5deg)}
.pthumb svg{display:block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:6px}
.gcell{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;line-height:14px}
.gcell span{font-family:var(--hand);font-size:16px;font-weight:700;line-height:16px}
.gcell small{color:var(--soft)}
.gcell.worn svg{opacity:.55}
.item .gsvg{flex:none;margin-top:-2px}
.prod.locked{opacity:.55}
.pbrand{display:inline-block;font-family:var(--hand);font-size:17px;font-weight:700;border:1.5px solid;border-radius:50%;padding:0 9px;transform:rotate(-3deg);margin-bottom:2px}
.pname{font-family:var(--hand);font-size:25px;font-weight:700;line-height:26px}
.pline{font-family:var(--serif);font-size:13px;font-style:italic;font-weight:400;color:var(--soft)}
.pmeta{font-size:13px;color:var(--soft)}
.pattr{font-size:14px}
.ptrait{font-size:13.5px;font-style:italic;color:var(--rust)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn.mini{width:auto;min-height:40px;margin:6px 0 0;padding:4px 14px;align-items:center;font-family:var(--hand);font-size:20px;font-weight:700}
.btn.mini::after{content:""}
.act .btn.mini{margin:0}
.tagline{display:inline-block;margin-top:6px;font-family:var(--hand);font-size:19px;color:var(--soft)}
/* scelte compatte */
.card h2{font-size:22px;line-height:26px}
.card p{font-size:15.5px;line-height:23px;margin:2px 0 4px}
.card .btn{min-height:46px;padding:6px 34px 6px 12px;margin:7px 0;font-size:15px;line-height:20px}
.card .btn .meta{font-size:16px;line-height:18px;margin-top:1px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .btn .meta .risk{margin-left:0}
.card .btn::after{font-size:24px;right:10px}
.card .risk{font-size:16px}
.note{font-size:14px;line-height:20px}
.out{font-size:19px;line-height:23px;margin:6px 0}
.scene .k{stroke:var(--ink)} .scene .kf{fill:var(--ink)} .scene .pf{fill:var(--paper)}
.scene{display:block;width:100%;height:auto;margin:6px 0 0;overflow:visible}
.bleed{width:calc(100% + 68px);max-width:none;margin:calc(-16px - env(safe-area-inset-top,0px)) -18px 6px -50px;background:#F3EAD6;border-bottom:1.5px solid var(--ink)}
.item input{accent-color:var(--rust)}
.card{background:transparent;border:none;padding:0;margin-top:12px}
.out{font-family:var(--hand);font-size:21px;line-height:26px;color:var(--rust);border:1.5px solid var(--rust);border-radius:3px 8px 4px 7px;padding:6px 12px;margin:10px 0;transform:rotate(-.6deg)}
.out.bad{color:var(--danger);border-color:var(--danger)}
.note{font-size:15px;font-style:italic;color:var(--soft);margin:2px 0}
.items{display:grid;gap:0;margin:4px 0 8px}
.item{display:flex;gap:10px;align-items:flex-start;background:transparent;border:none;border-bottom:1.5px dashed var(--faint);padding:8px 2px;cursor:pointer;line-height:24px}
.item input{margin-top:4px;accent-color:var(--rust);width:18px;height:18px;flex:none}
.item .kg{margin-left:auto;font-family:var(--hand);font-size:20px;font-weight:700;white-space:nowrap}
.item small{display:block;color:var(--soft);font-size:14px;line-height:20px}
.weight{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:4px 0;font-family:var(--hand);font-size:24px;font-weight:700;z-index:2;border-bottom:1.5px solid var(--ink)}
.weight.heavy{color:var(--danger)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:none;border-bottom:1.5px dashed var(--faint);padding:8px 2px;margin:0;line-height:24px}
.qrow small{display:block;color:var(--soft);font-size:14px;line-height:20px}
.qrow .btn{min-height:44px;margin:0;padding:4px 12px;align-items:center;font-family:var(--hand);font-size:20px;font-weight:700}
.qrow .btn::after{content:""}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:42px;height:42px;border-radius:50%;border:1.6px solid var(--ink);background:var(--paper2);box-shadow:1px 2px 0 rgba(46,38,32,.28);font-family:var(--hand);font-size:24px;font-weight:700;cursor:pointer}
.qty b{font-family:var(--hand);font-size:26px;min-width:22px;text-align:center}
.log{font-size:15px;color:var(--soft);margin-top:18px}
.log summary{font-family:var(--hand);font-size:22px;font-weight:700;color:var(--rust);cursor:pointer}
.log li{margin:2px 0;line-height:24px}
.stamp{display:inline-flex;align-items:center;justify-content:center;text-align:center;font-family:var(--hand);font-weight:700;font-size:16px;line-height:1.05;border:2px solid var(--rust);color:var(--rust);border-radius:50%;width:84px;height:84px;padding:8px;margin:6px 8px 6px 0;transform:rotate(-7deg);opacity:.8;vertical-align:top}
.stamp:nth-child(3n+2){transform:rotate(5deg);border-color:var(--lake);color:var(--lake)}
.stamp:nth-child(3n){transform:rotate(-2deg);border-color:var(--ok);color:var(--ok)}
details summary{list-style:none}
@keyframes passoA{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes passoB{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes braccio{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-12deg)}}
@keyframes ondeggia{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-1.6px)}}
@keyframes pioggia{to{stroke-dashoffset:-48}}
@keyframes vento{to{stroke-dashoffset:-120}}
@keyframes nuvola{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes nebbia{0%,100%{opacity:.55;transform:translateX(0)}50%{opacity:.85;transform:translateX(14px)}}
@keyframes raggi{to{transform:rotate(360deg)}}
@keyframes erba{0%,100%{transform:skewX(0)}50%{transform:skewX(-14deg)}}
@keyframes acqua{to{stroke-dashoffset:-30}}
@keyframes fumo{0%{transform:translate(0,0) scale(.8);opacity:0}20%{opacity:.5}100%{transform:translate(14px,-46px) scale(1.6);opacity:0}}
@keyframes fiamma{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes respiro{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.gamba-a{transform-box:fill-box;transform-origin:50% 0;animation:passoA 1.1s ease-in-out infinite}
.gamba-b{transform-box:fill-box;transform-origin:50% 0;animation:passoB 1.1s ease-in-out infinite}
.braccio{transform-box:fill-box;transform-origin:15% 5%;animation:braccio 1.1s ease-in-out infinite}
.corpo{animation:ondeggia 1.1s ease-in-out infinite}
.fermo .gamba-a,.fermo .gamba-b,.fermo .braccio,.fermo .corpo{animation:none}
.goccia{stroke-dasharray:7 17;animation:pioggia .45s linear infinite}
.raffica{stroke-dasharray:38 82;animation:vento 2.4s linear infinite}
.nuvola{animation:nuvola 14s ease-in-out infinite}
.banco{animation:nebbia 9s ease-in-out infinite}
.raggi{transform-box:fill-box;transform-origin:50% 50%;animation:raggi 40s linear infinite}
.erba{transform-box:fill-box;transform-origin:50% 100%;animation:erba 1.8s ease-in-out infinite}
.corrente{stroke-dasharray:8 7;animation:acqua 1.6s linear infinite}
.fumo{transform-box:fill-box;transform-origin:50% 50%;animation:fumo 4s ease-out infinite}
.luce{animation:fiamma 2.2s ease-in-out infinite}
.respiro{animation:respiro 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

}

    {l:'Le aggiri nella torbiera',min:10,out:[O(()=>(att('fango')>=2)?5:2,'g',`Giro largo, piedi salvi.`,{e:-4}),O(3,'b',`La torbiera ti inghiotte fino alla caviglia.`,{e:-5,add:['bagnati']})]},
    {l:'Passi piano in mezzo a loro',out:[O(2,'g',`Si scostano appena. Momento magico.`,{m:6}),O(2,'b',`Scappano tutte. Un allevatore in lontananza scuote la testa.`,{m:-6,mem:'renneDisturbate'})]}]},
{id:'guado',w:()=>S.wx==='pioggia'?5:3,title:'Il guado',
 text:()=>{const c=C();return `Il sentiero attraversa un torrente. ${c.rain?'Con la pioggia è gonfio e marrone.':c.ora==='sera'?'Nel pomeriggio la neve sciolta lo ha fatto salire.':'Acqua al polpaccio, sassi lisci.'}`},
 o:[{l:'Metti i sandali da guado',req:()=>(att('guado')>=1),min:20,out:[O(()=>(att('appoggio')>=1)?8:4,'g',`Acqua gelida, scarpe asciutte.`,{xp:3}),O(1,'m',`Scivoli: ginocchio sbucciato, ma scarpe asciutte.`,{e:-8,m:-3}),O(()=>S.wx==='pioggia'?2:0.3,'b',`La corrente ti strappa un sandalo. Finisci il guado zoppicando.`,{e:-10,m:-6})]},
    {l:'Ti togli le scarpe e passi scalzo',min:15,out:[O(3,'g',`Piedi congelati, scarpe asciutte.`,{m:2}),O(()=>(att('appoggio')>=1)?1:2,'b',`Un sasso tagliente ti apre la pianta del piede.`,{add:['vesciche'],m:-6})]},
    {l:'Attraversi con le scarpe ai piedi',min:3,out:[O(5,'m',`Veloce, ma ora sei fradicio.`,{add:['bagnati']}),O(()=>(att('appoggio')>=1)?1:3,'b',`Scivoli e finisci seduto nel torrente.`,{add:['bagnati','freddo'],e:-12,m:-8})]},
    {l:'Cerchi un passaggio più a monte',min:40,out:[O(2,'g',`Una fila di sassi asciutti. Ottimo occhio.`,{xp:4}),O(2,'b',`Quaranta minuti persi, e ti bagni comunque.`,{e:-8,add:['bagnati']}),O(1,'g',`Trovi un ponticello che non era sulla mappa.`,{xp:6,m:5})]}]},
{id:'storta',when:()=>S.energia<45&&!S.stati.has('storta'),w:()=>4,title:'Sassi traditori',
 text:`Sei stanco e il sentiero è un campo di blocchi. Il piede appoggia male.`,
 o:[{l:'Rallenti e guardi dove metti i piedi',min:20,out:[O(()=>(att('caviglia')>=2)?12:6,'g',`Caviglia salva.`),O(1,'b',`Una storta leggera.`,{add:['storta'],m:-6})]},
    {l:'Mantieni il ritmo',out:[O(()=>(att('caviglia')>=2)?5:2,'g',`Va tutto bene.`),O(2,'b',`La caviglia gira. Dolore vero.`,{add:['storta'],e:-10,m:-10})]},
    {l:'Ti fermi a riposare dieci minuti',min:10,out:[O(1,'g',`Le gambe si riprendono un po'.`,{e:6})]}]},
{id:'traccia',when:()=>S.wx==='nebbia'||S.wx==='nuvole',w:()=>S.wx==='nebbia'?7:1.5,title:'La traccia sparisce',
 text:`Gli ometti di pietra non si vedono più. Davanti a te solo roccia e nuvole basse.`,
 o:[{l:'Apri l\'app sul telefono',req:()=>inv('batteria')>=15,min:5,out:[O(4,'g',`Il puntino blu ti rimette sulla traccia.`,{give:{batteria:-15}}),O(1,'m',`Il GPS impazzisce tra le rocce. Ci metti un quarto d'ora.`,{give:{batteria:-20},min:15})]},
    {l:'Mappa e bussola',req:()=>(att('orientamento')>=1),min:20,out:[O(4,'g',`Azimut, passi contati. Eccolo, l'ometto.`,{xp:5}),O(1,'m',`Ci metti il doppio, ma lo trovi.`,{min:20,xp:3})]},
    {l:'Aspetti che la nebbia si alzi',min:45,out:[O(2,'g',`Si apre un varco: l'ometto era a dieci metri.`,{m:2}),O(2,'b',`Non si alza. Fa freddo, e alla fine vai comunque.`,{add:['freddo'],m:-4})]},
    {l:'Vai a intuito',out:[O(2,'g',`Istinto giusto.`,{xp:2}),O(3,'b',`Il sentiero era il letto di un torrente. Un'ora persa.`,{min:70,e:-12,m:-10,timbro:'Esploratore involontario'})]}]},
{id:'vento',when:()=>S.wx==='vento',w:()=>5,title:'Raffiche',
 text:()=>`Il vento arriva a raffiche su ${TERR[C().ter]} e ti sbilancia. Fa freddo, anche se è luglio.`,
 o:[{l:'Ti fermi a coprirti bene',req:()=>(att('calore')>=1)||(att('impermeabile')>=1),min:8,out:[O(1,'g',`Protetto. Il vento diventa solo rumore.`,{rm:['freddo']})]},
    {l:'Acceleri per uscire dalla zona esposta',min:-15,out:[O(1,'m',`Superi la zona aperta.`,{e:-6}),O(1,'b',`Sudato e gelato insieme.`,{e:-6,add:['freddo'],m:-5})]},
    {l:'Ti ripari dietro un masso e aspetti',min:30,out:[O(1,'m',`Il vento cala un po'.`,{e:4}),O(1,'b',`Il vento non cala. Hai solo perso tempo.`,{m:-3})]}]},
{id:'panorama',w:()=>S.wx==='sole'?4:1.5,title:'Il lago sotto di te',
 text:`Il sentiero si affaccia su un lago immenso, liscio come vetro.`,
 o:[{l:'Ti fermi a guardarlo',min:20,out:[O(4,'g',`Venti minuti che ti porterai a casa.`,{m:9,e:3}),O(1,'g',`Un tuffatore artico emerge davanti a te e canta.`,{m:12,timbro:'Il canto del tuffatore'})]},
    {l:'Tuffo veloce',min:25,out:[O(()=>S.wx==='sole'?3:1,'g',`Gelido. Rinasci.`,{m:12,rm:['scottato']}),O(()=>S.wx==='sole'?1:3,'b',`Troppo freddo: ci metti un'ora a smettere di tremare.`,{add:['freddo'],m:-2})]},
    {l:'Uno sguardo e via',out:[O(1,'m',`Bello. Avanti.`,{m:2})]}]},
{id:'zaino',when:()=>packKg()>10.5&&!S.flags.zaino,w:()=>4,title:'Lo zaino ti sega le spalle',
 text:`Gli spallacci bruciano e la schiena protesta. Forse è caricato male.`,
 o:[{l:'Ti fermi e lo risistemi',min:15,out:[O(3,'g',`Peso più alto e vicino alla schiena. Va meglio.`,{flag:'zaino',m:3}),O(1,'m',`Lo rifai tre volte. Alla fine è uguale.`,{m:-2})]},
    {l:'Abbandoni qualcosa in un rifugio d\'emergenza',min:10,out:[O(1,'m',`Lo lasci per chi passa. Più leggero.`,{drop:true,m:1})]},
    {l:'Sopporti',out:[O(1,'b',`Ogni passo una spallata.`,{m:-5,e:-4})]}]},
{id:'nuvolanera',when:()=>S.wx!=='pioggia',w:()=>1.5,title:'Nuvola nera all\'orizzonte',
 text:`Verso ovest il cielo diventa color piombo.`,
 o:[{l:'Acceleri per arrivare prima',min:-20,out:[O(1,'m',`Passo svelto, fiato corto.`,{e:-8})]},
    {l:'Ti prepari e mantieni il passo',min:5,out:[O(2,'g',`La nuvola passa più a nord.`),O(()=>(att('impermeabile')>=1)?0:2,'b',`Ti prende in pieno.`,{add:['bagnati'],m:-6}),O(()=>(att('impermeabile')>=1)?1:0,'m',`Ti prende in pieno, ma il guscio regge.`,{m:-2})]},
    {l:'Fai una pausa per vedere dove va',min:20,out:[O(1,'g',`Passa davanti a te. Riparti asciutto.`,{m:3}),O(1,'b',`Arriva dritta su di te mentre sei fermo.`,{add:['bagnati'],m:-6})]}]},
{id:'coppia',w:()=>1.5,title:'Due ragazzi senz\'acqua',
 text:`Una coppia seduta a bordo sentiero. Hanno finito l'acqua e il torrente più vicino è lontano.`,
 o:[{l:'Dividi la tua acqua',min:5,out:[O(1,'g',`Ti ringraziano come se fosse champagne. Si chiamano Elin e Maks.`,{e:-4,m:9,xp:6,mem:'coppia'})]},
    {l:'Indichi la sorgente sulla mappa',req:()=>(att('orientamento')>=1),min:5,out:[O(1,'g',`Ripartono verso la sorgente.`,{m:5,xp:3,mem:'coppia'})]},
    {l:'Auguri e prosegui',out:[O(1,'b',`Ci pensi per un po'.`,{m:-3})]}]},
{id:'lemming',w:()=>2,title:'Il lemming',
 text:`Un lemming minuscolo si pianta in mezzo al sentiero e ti sfida con un fischio furioso.`,
 o:[{l:'Accetti la sfida e lo fissi',min:5,out:[O(3,'g',`Vince lui. Te ne vai sconfitto e felice.`,{m:8,timbro:'Sfidato da un lemming'}),O(1,'m',`Ti morde lo stivale. Hai perso con onore.`,{m:5,timbro:'Morso da un lemming'})]},
    {l:'Giri largo con rispetto',min:2,out:[O(1,'g',`Il padrone della valle ti lascia passare.`,{m:3})]}]},
{id:'fotografo',w:()=>2,title:'Il fotografo appostato',
 text:`Un uomo mimetizzato con un teleobiettivo enorme ti fa segno di fermarti: aspetta un'aquila da tre ore.`,
 o:[{l:'Ti accucci e aspetti con lui',min:40,out:[O(2,'g',`L'aquila arriva. Lui scatta, tu guardi. Non lo dimenticherai.`,{m:12,xp:5,timbro:'Aquila reale'}),O(2,'m',`Non arriva. Ti offre caffè dal thermos.`,{m:3,e:4})]},
    {l:'Passi piano, chiedendo scusa',out:[O(2,'m',`Ti lascia passare con un sospiro.`,{m:-1}),O(1,'b',`L'aquila arriva proprio mentre passi, e vola via. Ti maledice in svedese.`,{m:-6})]},
    {l:'Fai il giro largo dietro la collina',min:15,out:[O(1,'g',`Ti ringrazia con un pollice in su.`,{e:-3,m:3})]}]},
{id:'nevaio',ter:['altopiano'],w:()=>5,title:'Il nevaio',
 text:()=>`Un nevaio taglia il sentiero. ${S.clock>900?'Nel pomeriggio la neve è molle.':'Di mattina è ancora dura e scivolosa.'}`,
 o:[{l:'Lo attraversi con i bastoncini',req:()=>(att('appoggio')>=1),out:[O(5,'g',`Passi sicuro, un piede dopo l'altro.`,{xp:2}),O(1,'m',`Sprofondi fino al ginocchio.`,{add:['bagnati']})]},
    {l:'Lo attraversi così',out:[O(()=>S.clock>900?3:2,'m',`Neve nelle scarpe, ma passi.`,{add:['bagnati']}),O(()=>S.clock>900?1:2,'b',`Scivoli per dieci metri sul sedere.`,{e:-8,m:-4,add:['bagnati']}),O(1,'g',`Scivoli per dieci metri sul sedere, e ridi come un bambino.`,{m:6,timbro:'Slitta umana'})]},
    {l:'Lo aggiri sulla pietraia',min:30,out:[O(2,'m',`Lungo ma asciutto.`,{e:-6}),O(1,'b',`Un sasso si muove sotto il piede.`,{e:-6,add:['storta']})]}]},
{id:'bivacco',w:()=>S.energia<50||S.wx==='pioggia'?4:1,title:'La capanna d\'emergenza',
 text:`Una piccola capanna rossa per le emergenze. Dentro, una panca e una stufa spenta.`,
 o:[{l:'Ti fermi un\'ora a riposare',min:60,out:[O(3,'g',`Ti togli le scarpe e chiudi gli occhi.`,{e:16,m:4,rm:['freddo']}),O(1,'g',`Sul libro degli ospiti trovi la firma di un amico.`,{e:14,m:10})]},
    {l:'Mezz\'ora per asciugarti',min:30,out:[O(1,'g',`Calze strizzate, giacca appesa. Meglio.`,{e:6,rm:['bagnati']})]},
    {l:'Firmi il libro e prosegui',min:3,out:[O(1,'g',`Il tuo nome, la data, «tutto bene».`,{m:2})]}]},
{id:'caldo',when:()=>S.wx==='sole'&&S.clock>720,w:()=>4,title:'Il sole picchia',
 text:`Nessuna nuvola, nessun albero. Il sole di luglio non tramonta mai e picchia.`,
 o:[{l:'Cappello calato e avanti',req:()=>(att('ombra')>=1),out:[O(1,'g',`Ombra sulla faccia, testa fresca.`)]},
    {l:'Bagni testa e maglia nel torrente',min:10,out:[O(3,'g',`Fresco immediato.`,{m:4,e:3}),O(1,'m',`Fresco per cinque minuti, poi di nuovo forno.`,{m:1})]},
    {l:'Tiri dritto',out:[O(1,'m',`Sudi e basta.`,{e:-5}),O(2,'b',`Collo e orecchie bruciati.`,{add:['scottato'],m:-6,e:-4})]}]},
{id:'campo',w:()=>2,title:'Tre tacche di campo',
 text:`Il telefono vibra: per la prima volta da ore c'è campo.`,
 o:[{l:'Chiami casa',req:()=>inv('batteria')>=10,min:10,out:[O(3,'g',`Voci conosciute. Ti fa bene.`,{m:10,give:{batteria:-10}}),O(1,'m',`Il lavoro ti ha cercato tre volte. Meglio non saperlo.`,{m:-4,give:{batteria:-10}})]},
    {l:'Controlli il meteo di domani',req:()=>inv('batteria')>=5,min:3,out:[O(1,'g',`Ora sai cosa aspettarti.`,{give:{batteria:-5},flag:'meteoSicuro'})]},
    {l:'Spegni il telefono',out:[O(1,'g',`Il silenzio era la parte migliore.`,{m:3})]}]},
{id:'scolaresca',w:()=>2,title:'La scolaresca',
 text:`Davanti a te una classe intera con due insegnanti. Occupano tutto il sentiero e cantano.`,
 o:[{l:'Li sorpassi di corsa',out:[O(2,'m',`Superati. Fiatone.`,{e:-7}),O(1,'b',`Ti piantano un bastoncino tra i piedi per sbaglio.`,{e:-7,m:-4})]},
    {l:'Resti dietro di loro',min:30,out:[O(1,'m',`Passo lento, canzoni infinite.`,{m:-3})]},
    {l:'Ti unisci al canto',min:20,out:[O(2,'g',`Ti insegnano una canzone svedese sulle rane.`,{m:10,timbro:'La canzone delle rane'}),O(1,'m',`Stoni così tanto che i bambini ridono di te.`,{m:4})]}]},
{id:'cane',w:()=>1.5,title:'Il cane che ti segue',
 text:`Un cane da pastore sbuca dalle betulle e si mette a camminare accanto a te.`,
 o:[{l:'Lo riporti verso il recinto che hai visto prima',min:35,out:[O(1,'g',`L'allevatore ti ringrazia con un pezzo di carne secca di renna.`,{xp:5,give:{barrette:3},mem:'cane'})]},
    {l:'Lo lasci fare',out:[O(2,'g',`Ti accompagna per un'ora e poi torna indietro da solo.`,{m:8}),O(1,'b',`Ti segue fino al rifugio. Il custode non è contento.`,{m:-3,s:-5})]},
    {l:'Lo mandi via',out:[O(1,'m',`Ti guarda deluso e se ne va.`,{m:-2})]}]},
{id:'passerelle',ter:['torbiera'],w:()=>5,title:'Passerelle rotte',
 text:`Le assi sulla torbiera sono marce. Alcune galleggiano, altre mancano del tutto.`,
 o:[{l:`Salti da un'asse all'altra`,out:[O(3,'g',`Equilibrista.`,{xp:2}),O(()=>packKg()>10?3:1,'b',`Lo zaino ti sbilancia. Gamba nella torba fino al ginocchio.`,{add:['bagnati'],m:-5})]},
    {l:'Cammini sui cespugli di lato',min:15,out:[O(2,'m',`Lento ma quasi asciutto.`,{e:-4}),O(1,'b',`I cespugli nascondono l'acqua.`,{add:['bagnati']})]},
    {l:'Ripari due assi col cordino per chi viene dopo',req:()=>(att('riparazione')>=1),min:25,out:[O(1,'g',`Lavoro da volontario. Ti senti utile.`,{xp:8,m:8})]}]},
{id:'temporale',ter:['altopiano'],when:()=>S.wx==='pioggia'||S.wx==='vento',w:()=>6,title:'Fulmini',
 text:`Un tuono rimbomba vicino. Sei sull'altopiano, la cosa più alta nel raggio di un chilometro.`,
 o:[{l:'Ti accovacci sullo zaino lontano dai bastoncini',min:30,out:[O(4,'m',`Passa sopra di te. Il cuore no.`,{m:-4,add:['freddo']}),O(1,'g',`Passa lontano. Respiri.`,{m:2})]},
    {l:'Scendi verso il fondovalle',min:40,out:[O(1,'m',`Più lungo, ma più sicuro.`,{e:-8})]},
    {l:'Corri verso il passo',out:[O(2,'m',`Ce la fai, terrorizzato.`,{e:-12,m:-6}),O(1,'b',`Un fulmine cade a cento metri. Ti tremano le gambe per un'ora.`,{e:-12,m:-15})]}]},
{id:'pontedineve',ter:['altopiano','valle'],w:()=>2,title:'Il ponte di neve',
 text:`Il torrente scorre sotto un arco di neve. Sopra, le impronte di qualcuno.`,
 o:[{l:'Ci passi sopra, veloce',out:[O(3,'g',`Regge.`),O(1,'b',`Crolla a metà. Gamba nell'acqua gelida.`,{add:['bagnati','freddo'],e:-8,m:-8})]},
    {l:'Cerchi un guado più a valle',min:30,out:[O(2,'m',`Guado facile, piedi bagnati.`,{add:['bagnati']}),O(1,'g',`Sassi perfetti, passi asciutto.`)]}]},
{id:'fika',w:()=>2,title:'Fika',
 text:`Una coppia di anziani svedesi ha steso una coperta accanto al sentiero. Ti invitano per il caffè con i dolci.`,
 o:[{l:'Ti siedi con loro',min:30,out:[O(3,'g',`Caffè forte, dolce alla cannella, storie di cinquant'anni di montagna.`,{e:8,m:10}),O(1,'g',`Ti raccontano del rifugio di stasera: «Arriva presto, si riempie».`,{e:8,m:8,flag:'avviso'})]},
    {l:'Ringrazi e prosegui',out:[O(1,'m',`Ti salutano con la mano.`)]}]},
{id:'ferito',w:()=>1.5,title:'Un escursionista ferito',
 text:`Un ragazzo è seduto con il ginocchio sanguinante. Una caduta sui sassi.`,
 o:[{l:'Lo medichi con i tuoi cerotti',use:{cerotti:2},req:()=>inv('cerotti')>=2,min:20,out:[O(1,'g',`Lo rimetti in piedi. Ti promette una birra a Gaskas.`,{xp:10,m:8,mem:'birra'})]},
    {l:'Lo accompagni per un tratto',min:45,out:[O(1,'g',`Arrivate insieme alla capanna. Te ne sarà grato.`,{xp:8,m:6,e:-6,mem:'birra'})]},
    {l:'Prometti di avvisare il prossimo rifugio',out:[O(1,'m',`Mantieni la parola, ma ci pensi tutto il giorno.`,{m:-3})]}]},
{id:'cascatella',when:()=>S.wx==='sole',w:()=>2,title:'Doccia di cascata',
 text:`Una piccola cascata cade su una roccia piatta, proprio accanto al sentiero.`,
 o:[{l:'Ti ci metti sotto vestito',min:15,out:[O(2,'g',`Urli, ridi, rinasci.`,{m:10,rm:['scottato']}),O(1,'m',`Poi cammini fradicio per un'ora.`,{m:6,add:['bagnati']})]},
    {l:'Ti bagni solo i piedi',min:10,out:[O(1,'g',`Piedi gonfi che ringraziano.`,{e:5})]},
    {l:'Avanti',out:[O(1,'m',`Peccato.`)]}]},
{id:'laccio',w:()=>1.5,title:'Il laccio si spezza',
 text:`Con uno strappo, il laccio della scarpa ti resta in mano.`,
 o:[{l:'Lo sostituisci con il cordino del kit',req:()=>(att('riparazione')>=1),min:10,out:[O(1,'g',`Meglio di prima.`)]},
    {l:'Fai un nodo con i due pezzi',min:5,out:[O(2,'m',`Regge, più o meno.`),O(1,'b',`La scarpa balla e il tallone sfrega.`,{later:{segs:1,txt:'Il tallone ha sfregato: vescica.',fx:{add:['vesciche']}}})]},
    {l:'Usi il laccio di un\'altra cosa',min:8,out:[O(1,'m',`Ora la sacca del sacco a pelo non si chiude più.`,{m:-1})]}]},
{id:'ometto',w:()=>1.5,title:'L\'ometto di pietra',
 text:`Un grande ometto di pietra segna il punto più alto del tratto. Tradizione vuole che si aggiunga un sasso.`,
 o:[{l:'Aggiungi il tuo sasso',min:3,out:[O(1,'g',`Un piccolo gesto per chi verrà dopo.`,{m:4})]},
    {l:'Ti siedi accanto a guardare la strada fatta',min:15,out:[O(1,'g',`Sei arrivato fin qui.`,{m:6,e:3})]}]},
{id:'corna',ter:['valle','betulle','altopiano'],w:()=>1.5,title:'Corna di renna',
 text:`A bordo sentiero, un palco di corna di renna perfetto, bianco di sole.`,
 o:[{l:'Lo porti con te come souvenir',out:[O(1,'m',`Bellissimo. Pesa più di un chilo.`,{kg:1.3,m:8,timbro:'Il palco di corna'})]},
    {l:'Una foto e lo lasci dov\'è',req:()=>inv('batteria')>=3,min:3,out:[O(1,'g',`Resta alla montagna.`,{m:3,give:{batteria:-3}})]},
    {l:'Lo lasci',out:[O(1,'m',`Ci ripensi per mezzo chilometro.`)]}]},
{id:'arcobaleno',when:()=>S.wx==='pioggia'||S.wx==='nuvole',w:()=>1.5,title:'L\'arcobaleno',
 text:`La pioggia smette di colpo. Un arcobaleno doppio si appoggia sul lago.`,
 o:[{l:'Ti fermi a guardarlo',min:10,out:[O(1,'g',`Il miglior premio per la pioggia presa.`,{m:12,timbro:'Arcobaleno doppio'})]},
    {l:'Ne approfitti per accelerare',min:-10,out:[O(1,'m',`Avanti, finché tiene.`,{e:-4})]}]},
{id:'runner',w:()=>1.5,title:'Il corridore',
 text:`Una ragazza ti supera correndo, zaino minuscolo, scarpe da trail. Fa il tuo giro di tre giorni in uno.`,
 o:[{l:'Le chiedi qualche consiglio',min:10,out:[O(2,'g',`«Meno peso, più acqua». Te lo segni.`,{xp:5,m:3}),O(1,'m',`Ti guarda lo zaino e ride. Riparte senza dire niente.`,{m:-3})]},
    {l:'Provi a tenerle il passo per un tratto',out:[O(1,'b',`Duecento metri. Poi crolli.`,{e:-12,m:-2}),O(1,'g',`Duecento metri di gloria. Ti senti giovane.`,{e:-10,m:6})]},
    {l:'La saluti',out:[O(1,'m',`Sparisce dietro la collina.`)]}]},
{id:'bastoncino',req:()=>(att('appoggio')>=1),when:()=>(att('appoggio')>=1),w:()=>1.5,title:'Il bastoncino incastrato',
 text:`La punta del bastoncino si incastra tra due rocce mentre ci appoggi tutto il peso.`,
 o:[{l:'Tiri con forza',out:[O(2,'g',`Esce, intatto.`),O(1,'b',`Si piega a metà.`,{m:-6,lose:'bastoncini'})]},
    {l:'Lo sfili con calma, ruotandolo',min:5,out:[O(1,'g',`Pazienza premiata.`)]}]},
/* ---- legati al luogo ---- */
{id:'cascata',tappe:[1],ter:['gola'],w:()=>5,title:'Deviazione per la cascata',
 text:`Un cartello indica una cascata nella gola, due chilometri fuori dal sentiero.`,
 o:[{l:'Vai a vederla',min:60,out:[O(4,'g',`Il fiume precipita nella roccia. Vale ogni passo.`,{e:-8,m:13,xp:8,timbro:'Cascata della gola'}),O(1,'m',`Bellissima, ma il sentiero di ritorno è fango puro.`,{e:-10,m:8,add:['bagnati'],timbro:'Cascata della gola'})]},
    {l:'Tiri dritto',out:[O(1,'m',`Sarà per la prossima volta.`)]}]},
{id:'alce',ter:['betulle'],w:()=>2,title:'Un\'ombra tra le betulle',
 text:`Qualcosa di enorme si muove tra le betulle, a trenta metri. Un'alce, con il piccolo.`,
 o:[{l:'Ti immobilizzi e guardi',min:15,out:[O(3,'g',`Ti guardano, masticano, se ne vanno.`,{m:12,timbro:'Alce con il piccolo'}),O(1,'b',`La madre abbassa la testa e sbuffa. Indietreggi col cuore in gola.`,{m:-4,e:-4})]},
    {l:'Le scatti una foto avvicinandoti',req:()=>inv('batteria')>=3,out:[O(1,'g',`Foto incredibile.`,{m:8,give:{batteria:-3},timbro:'Alce con il piccolo'}),O(2,'b',`La madre carica. Scappi tra i rami.`,{e:-10,m:-8,add:['storta']})]},
    {l:'Ti allontani piano',min:10,out:[O(1,'g',`Prudenza.`,{m:3})]}]},
{id:'ghiottone',w:()=>0.4,title:'Il ghiottone',
 text:`Una sagoma scura e tozza attraversa il pendio sopra di te. Non può essere. È un ghiottone.`,
 o:[{l:'Lo guardi finché sparisce',min:10,out:[O(1,'g',`Pochissimi lo vedono in una vita intera.`,{m:18,xp:10,timbro:'Il ghiottone'})]},
    {l:'Provi a seguirlo per vederlo meglio',min:30,out:[O(1,'g',`Lo rivedi per un attimo su una cresta.`,{m:20,xp:12,e:-8,timbro:'Il ghiottone'}),O(2,'m',`Sparito. Ti resta solo il dubbio di averlo sognato.`,{e:-8,m:2})]}]},
{id:'pescatore',ter:['lago'],w:()=>2,title:'Il pescatore',
 text:`Un vecchio pesca dalla riva. Sul fuoco, due salmerini stanno già cuocendo.`,
 o:[{l:'Accetti l\'invito a mangiare',min:40,out:[O(3,'g',`Il pesce più buono della tua vita, e storie di inverni a meno quaranta.`,{e:18,m:10,flag:'pranzo'}),O(1,'g',`Ti insegna a leggere il cielo. Domani saprai che tempo farà.`,{e:16,m:8,flag:'meteoSicuro'})]},
    {l:'Gli compri un pesce affumicato per dopo',out:[O(1,'g',`Nello zaino profuma tutto di fumo.`,{s:-8,give:{pasti:1}})]},
    {l:'Lo saluti',out:[O(1,'m',`Ti risponde senza alzare gli occhi dal galleggiante.`)]}]},
{id:'ponte',tappe:[2],w:()=>4,title:'Il ponte sospeso',
 text:()=>`Assi e cavi sopra un torrente impetuoso. ${S.wx==='vento'?'Il vento lo fa oscillare come un\'altalena.':'Oscilla a ogni passo.'}`,
 o:[{l:'Attraversi subito, una mano sul cavo',out:[O(()=>S.wx==='vento'?2:9,'g',`Dall'altra parte, cuore a mille.`,{xp:4,m:3}),O(()=>S.wx==='vento'?3:1,'b',`Una raffica fa ballare il ponte. Arrivi tremando.`,{m:-9,e:-5})]},
    {l:'Aspetti una pausa del vento',min:15,out:[O(1,'g',`Passi tranquillo.`)]},
    {l:'Ti fermi a guardare il torrente da metà ponte',min:10,out:[O(2,'g',`Sotto di te l'acqua tuona. Bellissimo e terribile.`,{m:8}),O(1,'b',`Ti gira la testa. Torni indietro e riparti.`,{m:-4,min:5})]}]},
{id:'allevatore',tappe:[2],w:()=>3,title:'L\'allevatore',
 text:()=>S.mem.has('renneDisturbate')?`L'uomo che ti ha visto spaventare le renne è al recinto. Ti guarda storto.`:`Un uomo con il cane controlla il recinto delle renne. Ti saluta e ti chiede dove vai.`,
 o:[{l:'Ti fermi a parlare con lui',min:35,out:[O(()=>S.mem.has('renneDisturbate')?1:4,'g',`Ti racconta dei pascoli estivi e di come il vento decide dove vanno le renne.`,{m:10,xp:8,timbro:'Storie di transumanza'}),O(()=>S.mem.has('renneDisturbate')?3:0.2,'m',`Ti spiega, senza sorridere, perché non si attraversa un branco.`,{m:-2,xp:6})]},
    {l:'Ti scusi per le renne',when:()=>S.mem.has('renneDisturbate'),min:10,out:[O(1,'g',`Annuisce. «Succede. Ora lo sai.» Ti offre un pezzo di carne secca.`,{m:6,give:{barrette:1},xp:4})]},
    {l:'Lo saluti e prosegui',out:[O(1,'m',`Un cenno, e riprendi il cammino.`)]}]},
{id:'scorciatoia',tappe:[2],w:()=>S.flags.dritta?8:3,title:'Una traccia che taglia',
 text:`Una traccia non segnata taglia il pendio. Sembra accorciare parecchio.`,
 o:[{l:'La prendi',min:-50,out:[O(()=>S.flags.dritta?9:(S.wx==='nebbia'?1:3),'g',`Cinquanta minuti risparmiati.`,{xp:4}),O(()=>S.wx==='nebbia'?4:2,'b',`Finisce in una pietraia. Torni indietro imprecando.`,{min:80,e:-12,m:-8}),O(1,'g',`Ti porta su un balcone di roccia con una vista pazzesca.`,{m:10,timbro:'Il balcone segreto'})]},
    {l:'Resti sul sentiero segnato',out:[O(1,'m',`Sicuro è sicuro.`)]}]},
{id:'mirtilli',ter:['valle','betulle'],w:()=>3,title:'Mirtilli',
 text:`Il pendio è viola di mirtilli maturi.`,
 o:[{l:'Ti fermi a raccoglierli',min:30,out:[O(3,'g',`Mani viola e due spuntini per dopo.`,{m:6,give:{barrette:2}}),O(1,'b',`Ne mangi troppi. Lo stomaco non è d'accordo.`,{m:3,later:{segs:1,txt:'Troppi mirtilli: mal di pancia.',fx:{add:['malessere']}}})]},
    {l:'Una manciata al volo',min:3,out:[O(1,'g',`Dolcissimi.`,{m:2})]}]},
{id:'tendate',w:()=>1.5,title:'Il campeggiatore',
 text:`Una tenda arancione vicino al torrente. Un ragazzo sta bollendo l'acqua e ti chiede se vuoi un tè.`,
 o:[{l:'Accetti',min:20,out:[O(3,'g',`Tè nero e zucchero. Ti racconta del cammino che sta facendo da sud.`,{e:6,m:6}),O(1,'g',`Ti regala un paio di calze di lana che non usa.`,{e:6,m:6,give:{calze:1}})]},
    {l:'Gli lasci un po\' del tuo gas: lui ne ha poco',use:{gas:1},req:()=>inv('gas')>0,min:5,out:[O(1,'g',`Ti stringe la mano due volte.`,{xp:6,m:8})]},
    {l:'Lo saluti',out:[O(1,'m',`Buon cammino.`)]}]},
{id:'bivio',w:()=>2,title:'Il cartello sbiadito',
 text:`Un bivio. Il cartello è stato girato dal vento, o da qualcuno con il senso dell'umorismo.`,
 o:[{l:'Controlli con la mappa',req:()=>(att('orientamento')>=1),min:5,out:[O(1,'g',`Destra. Ovviamente.`,{xp:2})]},
    {l:'Controlli col telefono',req:()=>inv('batteria')>=8,min:3,out:[O(1,'g',`Destra.`,{give:{batteria:-8}})]},
    {l:'Segui le impronte più fresche',out:[O(3,'g',`Le impronte avevano ragione.`),O(1,'b',`Le impronte erano di un gruppo che si è perso anche lui.`,{min:45,e:-8,m:-6})]},
    {l:'Tiri a indovinare',out:[O(1,'g',`Fortuna.`),O(1,'b',`Sbagliato. Torni indietro dopo mezz'ora.`,{min:60,e:-8,m:-8})]}]},
{id:'pietraia',ter:['altopiano','valle','gola'],w:()=>2.5,title:'La pietraia',
 text:()=>`Il sentiero diventa un fiume di massi. ${S.wx==='pioggia'?'Bagnati, scivolano come sapone.':'Ogni passo è un piccolo salto.'}`,
 o:[{l:'Piano, mani sui sassi',min:20,out:[O(4,'g',`Lenta, ma nessun problema.`,{e:-4}),O(1,'m',`Una mano sbucciata.`,{e:-4,m:-2})]},
    {l:'Saltelli da un masso all\'altro',out:[O(()=>S.wx==='pioggia'?1:3,'g',`Agile come una capra.`,{xp:2}),O(()=>S.wx==='pioggia'?3:1,'b',`Un piede finisce tra due massi.`,{add:['storta'],e:-8,m:-6})]}]},
{id:'sorgente',w:()=>1.5,title:'La sorgente',
 text:`Dalla roccia sgorga acqua limpida e gelida. Qualcuno ci ha lasciato una tazza di legno.`,
 o:[{l:'Bevi e riempi tutto',min:8,out:[O(1,'g',`L'acqua più buona del cammino.`,{e:6,m:4})]},
    {l:'Lavi faccia e collo',min:5,out:[O(1,'g',`Rinfrescato.`,{m:4,rm:['scottato']})]}]},
{id:'cane2',need:'cane',w:()=>6,title:'Lo stesso cane',
 text:`Il cane che avevi riportato all'allevatore ti raggiunge di corsa, scodinzolando. Ti ha ritrovato.`,
 o:[{l:'Lo lasci camminare con te',out:[O(1,'g',`Ti fa compagnia fino al passo, poi torna indietro.`,{m:12,timbro:'Un amico a quattro zampe'})]},
    {l:'Lo riporti di nuovo indietro',min:30,out:[O(1,'m',`Brava persona. Un po' stanca.`,{xp:4,e:-5})]}]}
];
/* ---- blocco comuni 01: 25 eventi nuovi ---- */
EV.push(
{id:'frana',w:()=>S.wx==='pioggia'?3:1.5,title:'Il sentiero è franato',
 text:`Un tratto di sentiero è scivolato a valle. Restano terra smossa e qualche radice.`,
 o:[{l:'Lo aggiri salendo sul pendio',min:25,out:[O(3,'m',`Fatica in più, ma sicuro.`,{e:-7}),O(1,'b',`Il pendio è più ripido del previsto. Mani nella terra.`,{e:-10,m:-4})]},
    {l:'Attraversi sulla terra smossa, svelto',out:[O(()=>(att('appoggio')>=1)?4:2,'g',`Tre passi decisi e sei di là.`,{xp:3}),O(2,'b',`Il terreno cede: scivoli per due metri.`,{e:-8,m:-6,add:['storta']})]},
    {l:'Torni al bivio e prendi la variante bassa',min:50,out:[O(1,'m',`Più lunga, ma tranquilla.`,{e:-4})]}]},
{id:'suola',w:()=>1.2,title:'La suola si scolla',
 text:`A ogni passo la punta della scarpa fa flap. La suola si sta staccando.`,
 o:[{l:'La ripari con il nastro del kit',req:()=>(att('riparazione')>=1),min:15,out:[O(4,'g',`Nastro americano: la soluzione a tutto.`),O(1,'m',`Regge, ma il nastro si consuma sui sassi.`,{later:{segs:3,txt:'Il nastro sotto la scarpa si è consumato: flap, flap.',fx:{m:-4}}})]},
    {l:'La leghi con un laccio di scorta',min:10,out:[O(2,'m',`Brutto ma efficace.`),O(1,'b',`Il nodo sfrega il collo del piede.`,{later:{segs:1,txt:'Il nodo improvvisato ti ha fatto una vescica.',fx:{add:['vesciche']}}})]},
    {l:'Cammini così fino al rifugio',out:[O(1,'b',`Flap, flap, flap. Inciampi ogni dieci passi.`,{m:-6,e:-5})]}]},
{id:'zip',w:()=>1.2,title:'La cerniera dello zaino',
 text:`La cerniera della tasca principale si è aperta da sola. Chissà da quanto.`,
 o:[{l:'Torni indietro a controllare se hai perso qualcosa',min:30,out:[O(2,'g',`Non manca niente. Solo paura.`,{m:2}),O(1,'g',`Trovi il sacchetto delle barrette a cento metri.`,{m:4})]},
    {l:'Controlli l\'inventario e richiudi',min:5,out:[O(2,'m',`Manca il sacchetto delle barrette.`,{give:{barrette:-2},m:-4}),O(2,'g',`C'è tutto.`)]},
    {l:'La chiudi con una spilla del kit',req:()=>(att('riparazione')>=1),min:5,out:[O(1,'g',`Sistemata per sempre. O almeno per questo cammino.`)]}]},
{id:'borraccia',w:()=>1.2,title:'Qualcosa gocciola',
 text:`Senti la schiena bagnata. Non è sudore: la borraccia dentro lo zaino perde.`,
 o:[{l:'Svuoti lo zaino e asciughi tutto',min:25,out:[O(3,'m',`Sacco a pelo salvo per un pelo.`,{m:-2}),O(1,'b',`Troppo tardi: il sacco a pelo è umido.`,{flag:'saccoUmido',m:-4})]},
    {l:'Sposti la borraccia fuori e speri',min:3,out:[O(2,'g',`Danni limitati.`),O(2,'b',`Stanotte scoprirai che il sacco a pelo è bagnato.`,{flag:'saccoUmido'})]}]},
{id:'muro',when:()=>S.energia<55,w:()=>3,title:'Il muro',
 text:`Non sei sfinito, ma la testa dice basta. Ogni passo è una trattativa.`,
 o:[{l:'Conti i passi a gruppi di cento',out:[O(2,'g',`Funziona. Mille, duemila, tremila.`,{m:4}),O(1,'m',`Perdi il conto a quattrocento. Ricominci.`,{m:-1})]},
    {l:'Ti dai un obiettivo: la prossima curva, poi la prossima',out:[O(3,'g',`Una curva alla volta, il rifugio si avvicina.`,{m:3})]},
    {l:'Ti siedi e ti concedi dieci minuti di niente',min:10,out:[O(2,'g',`La testa si svuota. Riparti.`,{m:6,e:3}),O(1,'b',`Seduto è peggio: rialzarsi costa il doppio.`,{m:-4})]},
    {l:'Mangi qualcosa di dolce',use:{barrette:1},req:()=>inv('barrette')>0,out:[O(1,'g',`Lo zucchero ti rimette di buonumore.`,{m:5,e:5})]}]},
{id:'gruppo',w:()=>1.5,title:'Il gruppo allegro',
 text:`Quattro amici ti chiedono se vuoi camminare con loro. Vanno decisamente più forte di te.`,
 o:[{l:'Ti unisci e tieni il loro passo',min:-30,out:[O(2,'g',`Chiacchiere, risate e chilometri che volano.`,{m:8,e:-10}),O(1,'b',`Dopo un'ora sei a pezzi. Ti stacchi, senza fiato.`,{e:-16,m:-4})]},
    {l:'Cammini con loro solo fino alla prossima pausa',out:[O(1,'g',`Il tempo giusto per conoscerli.`,{m:5,e:-4})]},
    {l:'Declini con un sorriso',out:[O(1,'m',`Li guardi sparire avanti.`)]}]},
{id:'solitario',w:()=>1.2,title:'Chi cammina da solo',
 text:`Una ragazza ti si affianca. Ammette che camminare da sola le mette ansia e chiede se può stare con te.`,
 o:[{l:'Certo, camminate insieme',min:25,out:[O(3,'g',`Si rilassa. Arrivate al rifugio raccontandovi la vita.`,{m:8,xp:5,mem:'amica'}),O(1,'m',`Parla tantissimo. Bella persona, testa che scoppia.`,{m:2,mem:'amica'})]},
    {l:'Le dici che vai al tuo passo, ma la aspetti alle pause',out:[O(1,'g',`Un buon compromesso.`,{m:4,xp:2})]},
    {l:'Le spieghi che preferisci stare da solo',out:[O(1,'b',`Annuisce. La vedi rallentare dietro di te.`,{m:-5})]}]},
{id:'bisogno',w:()=>2,title:'Un bisogno urgente',
 text:`La natura chiama. Con insistenza. Il sentiero è completamente allo scoperto.`,
 o:[{l:'Cerchi un posto riparato lontano dal sentiero',min:15,out:[O(3,'g',`Privacy e panorama.`),O(1,'m',`Il posto riparato era una pozza nascosta.`,{add:['bagnati']})]},
    {l:'Ti accontenti del primo masso',min:3,out:[O(2,'g',`Nessuno in vista. Missione compiuta.`),O(1,'b',`Proprio in quel momento sbuca un gruppo di dieci persone.`,{m:-6,timbro:'Imbarazzo totale'})]},
    {l:'Resisti fino al rifugio',out:[O(1,'b',`Ogni passo è una sofferenza.`,{m:-8,later:{segs:1,txt:'Hai resistito fin troppo: ti fermi comunque, di corsa.',fx:{min:10}}})]}]},
{id:'telefono',w:()=>1.2,title:'Il telefono scivola',
 text:`Tiri fuori il telefono per una foto e ti scivola di mano verso le rocce.`,
 o:[{l:'Ti lanci per prenderlo',out:[O(2,'g',`Presa al volo. Riflessi da portiere.`,{m:4}),O(1,'b',`Lo prendi, ma batti il ginocchio su un sasso.`,{e:-6,add:['ginocchio']}),O(1,'b',`Lo manchi. Schermo crepato, batteria che impazzisce.`,{give:{batteria:-40},m:-6})]},
    {l:'Lo lasci cadere e speri',out:[O(1,'g',`Atterra sul muschio. Intatto.`),O(1,'b',`Schermo in frantumi.`,{give:{batteria:-30},m:-5})]}]},
{id:'rifiuti',w:()=>1.2,title:'Rifiuti sul sentiero',
 text:`Una lattina, due incarti e una bottiglia di plastica abbandonati accanto a un masso.`,
 o:[{l:'Li raccogli e li porti al rifugio',min:5,out:[O(1,'g',`Pesano poco, e il sentiero è più bello.`,{kg:0.3,m:5,xp:4,mem:'raccolto'})]},
    {l:'Li lasci dove sono',out:[O(1,'b',`Ti dà fastidio per un chilometro.`,{m:-3})]}]},
{id:'prato',when:()=>S.wx==='sole'||S.wx==='nuvole',w:()=>2,title:'Il prato fiorito',
 text:`Un pendio coperto di fiori gialli e viola, mosso dal vento.`,
 o:[{l:'Ti sdrai in mezzo ai fiori',min:20,out:[O(3,'g',`Cielo, fiori e niente altro.`,{m:9,e:4}),O(1,'m',`Ti sdrai su un formicaio.`,{m:-2,min:5})]},
    {l:'Lo attraversi piano godendoti il profumo',min:5,out:[O(1,'g',`Bellezza senza fermarsi.`,{m:4})]}]},
{id:'crampo',when:()=>S.energia<60,w:()=>2,title:'Il crampo',
 text:`Un dolore secco al polpaccio ti blocca a metà salita.`,
 o:[{l:'Ti fermi e allunghi il muscolo',min:10,out:[O(3,'g',`Si scioglie piano.`),O(1,'m',`Torna dopo un chilometro.`,{later:{segs:1,txt:'Il crampo è tornato.',fx:{e:-5,min:10}}})]},
    {l:'Bevi e mangi qualcosa di salato',use:{barrette:1},req:()=>inv('barrette')>0,min:10,out:[O(1,'g',`Sali e zuccheri: il muscolo si rilassa.`,{e:5})]},
    {l:'Stringi i denti e continui',out:[O(1,'m',`Zoppichi per un po'.`,{e:-6,m:-3}),O(1,'b',`Il crampo ti fa cadere in ginocchio.`,{e:-8,m:-6,add:['ginocchio']})]}]},
{id:'sfregamento',when:()=>S.wx==='sole'||S.stati.has('bagnati'),w:()=>1.5,title:'Sfregamento',
 text:`Tra sudore e pantaloni umidi, l'interno delle cosce brucia a ogni passo.`,
 o:[{l:'Proteggi la pelle con un cerotto largo',use:{cerotti:1},req:()=>inv('cerotti')>0,min:5,out:[O(1,'g',`Sollievo immediato.`)]},
    {l:'Cambi andatura e speri',out:[O(1,'m',`Cammini come un cowboy. Funziona a metà.`,{m:-3}),O(1,'b',`Peggiora.`,{m:-7})]},
    {l:'Ti lavi al torrente e lasci asciugare',min:20,out:[O(1,'g',`Pelle fresca, problema risolto.`,{m:3})]}]},
{id:'grandine',when:()=>S.wx==='pioggia'||S.wx==='vento',w:()=>2,title:'Grandine',
 text:`Il cielo diventa bianco e arrivano chicchi grandi come piselli.`,
 o:[{l:'Ti ripari sotto una roccia sporgente',min:20,out:[O(1,'m',`Rumore assordante, poi silenzio.`,{m:-1})]},
    {l:'Cappuccio e zaino sulla testa, avanti',out:[O(1,'m',`Ti picchia sulle nocche.`,{m:-4}),O(1,'b',`Dura dieci minuti. Mani gelate e livide.`,{m:-7,add:['freddo']})]},
    {l:'Ti metti a ridere e la guardi cadere',min:10,out:[O(1,'g',`Il mondo diventa bianco in piena estate.`,{m:5,add:['freddo'],timbro:'Grandine a luglio'})]}]},
{id:'cima',w:()=>S.wx==='sole'?3:1.5,title:'Una cima senza nome',
 text:`Una piccola cima sopra il sentiero, venti minuti di salita senza traccia.`,
 o:[{l:'Sali',min:45,out:[O(3,'g',`Il mondo intero sotto di te.`,{e:-8,m:11,xp:6,timbro:'Una cima senza nome'}),O(1,'m',`In cima arriva la nebbia. Non vedi niente.`,{e:-8,m:-2,xp:3})]},
    {l:'La guardi da sotto',out:[O(1,'m',`Sarà la scusa per tornare.`)]}]},
{id:'chiuso',w:()=>1.2,title:'Sentiero chiuso',
 text:`Un cartello improvvisato: «Ponte danneggiato, usare la variante». La variante è lunga.`,
 o:[{l:'Prendi la variante',min:45,out:[O(1,'m',`Un'ora in più, nessuna sorpresa.`,{e:-6})]},
    {l:'Vai comunque a vedere il ponte',min:10,out:[O(2,'b',`Il ponte non c'è proprio più. Torni indietro.`,{min:50,e:-8,m:-5}),O(1,'g',`Il ponte è rovinato ma si passa con attenzione.`,{xp:4})]}]},
{id:'eco',ter:['gola','valle'],w:()=>1.5,title:'L\'eco',
 text:`Le pareti della valle si chiudono. Basta un colpo di tosse e la montagna risponde.`,
 o:[{l:'Gridi il tuo nome',out:[O(3,'g',`La montagna te lo restituisce tre volte.`,{m:5}),O(1,'m',`Ti risponde anche qualcuno, da molto lontano. Imbarazzo.`,{m:3,timbro:'Risposta dalla montagna'})]},

{id:'assebagnate',when:()=>S.wx==='pioggia',w:()=>3,title:'Assi scivolose',
 text:`Le passerelle di legno sono coperte di alghe sottili. Sotto la pioggia sono sapone.`,
 o:[{l:'Piano, un piede alla volta',min:15,out:[O(1,'g',`Nessuna caduta.`)]},
    {l:'Cammini accanto alle assi',min:5,out:[O(1,'b',`Torba fino alla caviglia.`,{add:['bagnati']}),O(1,'g',`Il terreno accanto regge.`)]},
    {l:'Passo normale',out:[O(()=>(att('appoggio')>=1)?3:1,'g',`Gamba ferma.`),O(2,'b',`Sedere a terra, schiena dolorante.`,{e:-6,m:-6})]}]},
{id:'radici',ter:['betulle'],w:()=>3,title:'Le radici',
 text:()=>`Il sentiero nel bosco è un intreccio di radici${S.wx==='pioggia'?' bagnate e lucide':''}.`,
 o:[{l:'Le guardi una per una',min:10,out:[O(1,'g',`Concentrazione da monaco.`)]},
    {l:'Passo svelto',out:[O(()=>S.wx==='pioggia'?1:3,'g',`Ballerino tra le radici.`),O(()=>S.wx==='pioggia'?3:1,'b',`Un piede si incastra. La caviglia gira.`,{add:['storta'],m:-5})]}]},
{id:'ghiaione',ter:['altopiano','gola'],w:()=>2.5,title:'Il ghiaione',
 text:`Una discesa su ghiaia fine e mobile, larga come un campo da calcio.`,
 o:[{l:'Scivoli giù sui talloni, come sugli sci',min:-15,out:[O(2,'g',`Il modo più divertente di scendere mai inventato.`,{m:10,timbro:'Sci sulla ghiaia'}),O(1,'b',`Ghiaia nelle scarpe e un ginocchio sbucciato.`,{m:-3,later:{segs:1,txt:'La ghiaia nelle scarpe ha lasciato il segno.',fx:{add:['vesciche']}}})]},
    {l:'Scendi lungo il bordo erboso',min:10,out:[O(1,'g',`Lento, sicuro.`)]}]},
{id:'vipera',when:()=>S.wx==='sole',w:()=>1.5,title:'La vipera',
 text:`Una vipera prende il sole proprio in mezzo al sentiero. Non ha nessuna intenzione di spostarsi.`,
 o:[{l:'Aspetti che se ne vada',min:15,out:[O(2,'g',`Dopo un po' scivola tra i sassi.`),O(1,'m',`Non se ne va. La aggiri largo.`,{min:10})]},
    {l:'La aggiri largo nell\'erba',min:8,out:[O(1,'g',`Pericolo evitato.`)]},
    {l:'Batti i bastoncini a terra per farla andare',req:()=>(att('appoggio')>=1),out:[O(1,'g',`Sente le vibrazioni e sparisce.`)]}]},
{id:'cresta',ter:['altopiano'],w:()=>2,title:'Il filo di cresta',
 text:`Il sentiero corre su una cresta: a destra una valle, a sinistra un'altra.`,
 o:[{l:'Ti fermi in cima a guardare entrambe',min:15,out:[O(()=>S.wx==='sole'?3:1,'g',`Due mondi in un colpo d'occhio.`,{m:10}),O(()=>S.wx==='vento'?3:1,'b',`Il vento ti spinge via. Scendi con le gambe molli.`,{m:-4,add:['freddo']})]},
    {l:'Passi in fretta',out:[O(1,'m',`Uno sguardo di sfuggita.`,{m:2})]}]},
{id:'cerottirichiesta',w:()=>1.5,title:'Hai un cerotto?',
 text:`Una signora con un taglio sul dito ti chiede se hai un cerotto.`,
 o:[{l:'Gliene dai uno',use:{cerotti:1},req:()=>inv('cerotti')>0,out:[O(1,'g',`Ti regala due biscotti fatti in casa.`,{give:{barrette:2},m:4})]},
    {l:'Le spieghi che ne hai pochi',out:[O(1,'m',`Capisce, ma ci resta male.`,{m:-2})]}]},
{id:'messaggio',when:()=>inv('batteria')>0,w:()=>1.5,title:'Un messaggio da casa',
 text:`Per un attimo c'è campo e arriva un messaggio di qualche ora fa.`,
 o:[{l:'Lo leggi',out:[O(3,'g',`«Siamo fieri di te. Mandaci una foto.»`,{m:8}),O(1,'b',`Problemi al lavoro. Niente di grave, ma ora ci pensi.`,{m:-6})]},
    {l:'Lo lasci per stasera',out:[O(1,'m',`La curiosità ti accompagna.`)]}]},
{id:'tentazione',when:()=>inv('barrette')>=3,w:()=>2,title:'La tentazione',
 text:`Le barrette nello zaino ti chiamano. Non hai davvero fame. Ma sono lì.`,
 o:[{l:'Ne mangi due',use:{barrette:2},out:[O(1,'g',`Felicità immediata.`,{m:6,e:6})]},
    {l:'Ne mangi una',use:{barrette:1},out:[O(1,'g',`Il giusto premio.`,{m:3,e:3})]},
    {l:'Resisti',out:[O(1,'m',`Disciplina di ferro. Un po' triste.`,{m:-1})]}]},
{id:'tronco',w:()=>2,title:'Il tronco',
 text:`Il ponte sul torrente è un unico tronco, largo una spanna.`,
 o:[{l:'Lo attraversi in piedi',out:[O(()=>(att('appoggio')>=1)?4:2,'g',`Equilibrio perfetto.`,{xp:3}),O(()=>packKg()>10?3:1,'b',`Lo zaino ti sbilancia. Splash.`,{add:['bagnati','freddo'],m:-8})]},
    {l:'Lo attraversi a cavalcioni',min:10,out:[O(1,'g',`Poco elegante, completamente asciutto.`,{m:2})]},
    {l:'Guadi accanto',min:5,out:[O(1,'m',`Piedi bagnati, dignità intatta.`,{add:['bagnati']})]}]},
{id:'silenzio',w:()=>1.5,title:'Il silenzio',
 text:`Ti fermi e ti accorgi che non c'è nessun suono. Né vento, né acqua, né uccelli. Niente.`,
 o:[{l:'Resti fermo ad ascoltarlo',min:10,out:[O(1,'g',`Non lo avevi mai sentito così.`,{m:9})]},
    {l:'Riparti',out:[O(1,'m',`I tuoi passi rompono l'incanto.`)]}]},
{id:'musica',when:()=>S.seg>=2,w:()=>1.5,title:'I tornanti infiniti',
 text:`Tornanti su tornanti, tutti uguali. La testa comincia a girare a vuoto.`,
 o:[{l:'Musica nelle cuffie',req:()=>inv('batteria')>=10,out:[O(1,'g',`I tornanti passano a tempo di musica.`,{m:6,give:{batteria:-10}})]},
    {l:'Canti a voce alta',out:[O(2,'g',`Nessuno ti sente. Forse.`,{m:5}),O(1,'m',`Un gruppo ti sente benissimo.`,{m:2})]},
    {l:'Conti i tornanti',out:[O(1,'m',`Ventisette. Poi perdi il conto.`)]}]},
{id:'volontari',w:()=>1.2,title:'I volontari',
 text:`Due volontari stanno ridipingendo i segnavia, secchio di vernice e pennello.`,
 o:[{l:'Li aiuti per un tratto',min:40,out:[O(1,'g',`Dipingi tre segnavia. Saranno lì per anni.`,{xp:10,m:8,mem:'volontari',e:-4})]},
    {l:'Li ringrazi per il lavoro',out:[O(1,'g',`Sorridono.`,{m:3})]}]},
{id:'spina',w:()=>1.2,title:'La scheggia',
 text:`Appoggiandoti a un tronco ti pianti una scheggia nel palmo.`,
 o:[{l:'La togli con le pinzette del kit',req:()=>(att('riparazione')>=1),min:5,out:[O(1,'g',`Uscita intera.`)]},
    {l:'La togli con le unghie',min:10,out:[O(1,'g',`Ci riesci al terzo tentativo.`),O(1,'b',`Resta dentro un pezzetto.`,{m:-4})]},
    {l:'La lasci, uscirà da sola',out:[O(1,'m',`Pulsa per ore.`,{m:-3})]}]},
{id:'pranzocondiviso',when:()=>inv('pasti')>0,w:()=>1.2,title:'Chi ha dimenticato il pranzo',
 text:`Un ragazzo ti confessa di aver lasciato il cibo al rifugio. Ha ancora mezza giornata davanti.`,
 o:[{l:'Gli dai uno dei tuoi pasti',use:{pasti:1},out:[O(1,'g',`Ti stringe la mano come un fratello.`,{xp:8,m:9})]},
    {l:'Gli dai una barretta',use:{barrette:1},req:()=>inv('barrette')>0,out:[O(1,'g',`Meglio di niente.`,{m:4,xp:2})]},
    {l:'Gli auguri buona fortuna',out:[O(1,'b',`Lo vedi andar via a pancia vuota.`,{m:-4})]}]},
{id:'pioggiaesole',when:()=>S.wx==='nuvole'||S.wx==='sole',w:()=>1.2,title:'Pioggia col sole',
 text:`Piove e c'è il sole nello stesso momento. Ogni goccia brilla.`,
 o:[{l:'Ti fermi a guardare',min:5,out:[O(1,'g',`Una magia di pochi minuti.`,{m:6})]},
    {l:'Prosegui',out:[O(1,'m',`Bagnato e abbagliato.`)]}]},
{id:'stretching',when:()=>S.seg<=2,w:()=>2,title:'Le gambe del mattino',
 text:`Le gambe sono legnose dal giorno prima. I primi passi sono dolorosi.`,
 o:[{l:'Dieci minuti di allungamento',min:10,out:[O(1,'g',`Muscoli sciolti. Il resto del giorno va meglio.`,{e:6})]},
    {l:'Parti piano e lasci che si scaldino',out:[O(2,'g',`Dopo un chilometro va tutto bene.`),O(1,'m',`Ci mettono un'ora.`,{e:-3})]}]},
{id:'controvento',when:()=>S.wx==='vento',w:()=>3,title:'Controvento',
 text:`Il vento soffia dritto in faccia. Ogni passo è il doppio della fatica.`,
 o:[{l:'Ti metti dietro un altro escursionista',min:10,out:[O(2,'g',`Ti fa da scudo. Lo ringrazi con una barretta.`,{give:{barrette:-1},m:3}),O(1,'m',`Va troppo lento per te.`,{min:10})]},
    {l:'Testa bassa e passo corto',out:[O(1,'m',`Fatica, ma avanzi.`,{e:-7})]},
    {l:'Cerchi un percorso più riparato sotto la cresta',min:20,out:[O(2,'g',`Il vento cala di colpo.`,{e:-3}),O(1,'b',`Non c'è riparo. Hai solo allungato.`,{e:-6,m:-3})]}]},
{id:'caffeprivato',w:()=>1.5,title:'Caffè e dolci, 1 km',
 text:`Un cartello scritto a mano: «Capanna privata, caffè e dolci. 1 km di deviazione.»`,
 o:[{l:'Vai',min:40,out:[O(3,'g',`Torta ai mirtilli e caffè forte in una cucina di legno.`,{s:-8,e:10,m:10}),O(1,'m',`Chiuso. Cartello vecchio.`,{e:-4,m:-5})]},
    {l:'Prosegui',out:[O(1,'m',`Il cartello ti tormenta per un chilometro.`)]}]}
);
EV.forEach(e=>e.cat=e.cat||'comune');
/* ---- blocco comuni 05: 25 eventi, più duri ---- */
EV.push(
{id:'allagato',when:()=>S.wx==='pioggia',w:()=>3,title:'Il sentiero allagato',
 text:`Per duecento metri il sentiero è sotto una spanna d'acqua.`,
 o:[{l:'Sandali e avanti',req:()=>(att('guado')>=1),min:15,out:[O(1,'g',`Piedi gelati, scarpe salve.`)]},
    {l:'Dritto con le scarpe',out:[O(()=>(att('fango')>=2)?2:1,'m',`Le ghette reggono quasi fino in fondo.`,{}),O(3,'b',`Acqua fino alle calze in tre passi.`,{add:['bagnati'],m:-3})]},
    {l:'Lo aggiri sul pendio',min:30,out:[O(2,'m',`Lungo e faticoso, ma asciutto.`,{e:-8}),O(1,'b',`Anche il pendio è una spugna.`,{e:-8,add:['bagnati']})]}]},
{id:'cadutasassi',ter:['gola','altopiano','valle'],w:()=>S.wx==='pioggia'?3:1.5,title:'Sassi dall\'alto',
 text:`Un rumore secco sopra di te. Un sasso rimbalza giù dal pendio, dritto verso il sentiero.`,
 o:[{l:'Ti appiattisci contro la roccia',out:[O(3,'g',`Ti passa a un metro. Respira.`,{m:-3}),O(1,'b',`Una scheggia ti colpisce la spalla.`,{e:-8,m:-8})]},
    {l:'Corri avanti',out:[O(2,'g',`Fuori dalla traiettoria.`,{e:-5}),O(1,'b',`Inciampi correndo.`,{e:-8,add:['storta']})]},
    {l:'Ripari la testa con lo zaino',out:[O(1,'g',`Lo zaino prende il colpo. Il fornelletto è un po' ammaccato.`,{m:-2})]}]},
{id:'cambioasciutto',when:()=>S.stati.has('freddo')&&S.stati.has('bagnati'),w:()=>6,title:'Freddo e bagnato',
 text:`Bagnato e infreddolito insieme. Il corpo comincia a non rispondere bene: le dita non chiudono la cerniera.`,
 o:[{l:'Ti fermi al riparo e ti cambi tutto quello che puoi',min:25,out:[O(3,'g',`Vestiti asciutti, il tremore cala.`,{rm:['freddo'],m:4}),O(1,'m',`Ti cambi, ma sei ancora gelato.`,{m:-2})]},
    {l:'Mangi e cammini più forte',use:{barrette:2},req:()=>inv('barrette')>=2,out:[O(1,'g',`Il corpo si scalda dal di dentro.`,{rm:['freddo'],e:4})]},
    {l:'Tieni duro fino al rifugio',out:[O(1,'b',`Arrivi in stato pietoso.`,{m:-12,e:-10})]}]},
{id:'calzabucata',w:()=>1.5,title:'La calza bucata',
 text:`Senti l'alluce libero dentro la scarpa. La calza si è bucata.`,
 o:[{l:'La cambi',use:{calze:1},req:()=>inv('calze')>0,min:8,out:[O(1,'g',`Calza nuova, piede felice.`)]},
    {l:'La giri in modo che il buco stia sopra',min:5,out:[O(2,'g',`Genio della sopravvivenza.`),O(1,'b',`Il buco torna sotto in dieci minuti.`,{later:{segs:1,txt:'Il buco nella calza ha fatto vescica.',fx:{add:['vesciche']}}})]},
    {l:'Ignori',out:[O(1,'b',`Sfrega, sfrega, sfrega.`,{later:{segs:1,txt:'La calza bucata ha lasciato il segno.',fx:{add:['vesciche'],m:-3}}})]}]},
{id:'fondostrappato',w:()=>1,title:'Lo zaino si strappa',
 text:`Un sasso aguzzo ha aperto un taglio sul fondo dello zaino. Qualcosa potrebbe uscire.`,
 o:[{l:'Lo ripari col nastro',req:()=>(att('riparazione')>=1),min:10,out:[O(1,'g',`Toppa da professionista.`)]},
    {l:'Sposti le cose piccole in alto',min:10,out:[O(2,'g',`Niente si è perso.`),O(1,'b',`Manca il sacchetto dei cerotti.`,{give:{cerotti:-2},m:-4})]},
    {l:'Prosegui e speri',out:[O(1,'b',`Più tardi scopri di aver seminato due barrette e un cerotto.`,{give:{barrette:-2,cerotti:-1},m:-4}),O(1,'g',`Niente è uscito. Fortuna.`)]}]},
{id:'insolazione',when:()=>S.stati.has('scottato')&&S.wx==='sole',w:()=>5,title:'Troppo sole',
 text:`La testa pulsa, la pelle brucia, hai un leggero capogiro.`,
 o:[{l:'Ti fermi all\'ombra e bevi molto',min:40,out:[O(3,'g',`Il capogiro passa.`,{e:6}),O(1,'m',`Passa, ma la testa resta pesante.`,{e:2,m:-3})]},
    {l:'Bagni testa e collo e prosegui piano',min:10,out:[O(1,'m',`Va meglio, per ora.`,{m:-2})]},
    {l:'Prosegui come se niente fosse',out:[O(1,'b',`Il capogiro peggiora. Devi fermarti comunque.`,{min:40,e:-14,m:-8})]}]},
{id:'maltesta',when:()=>S.energia<50,w:()=>2,title:'Mal di testa',
 text:`Un cerchio alla testa che non passa. Forse non hai bevuto abbastanza.`,
 o:[{l:'Bevi mezzo litro tutto in una volta',min:3,out:[O(2,'g',`In mezz'ora passa.`,{m:2}),O(1,'m',`Passa solo un po'.`)]},
    {l:'Ti sdrai dieci minuti con gli occhi chiusi',min:10,out:[O(1,'g',`Meglio.`,{e:4,m:2})]},
    {l:'Ignori',out:[O(1,'b',`Ti accompagna fino al rifugio.`,{m:-6})]}]},
{id:'caneaggressivo',w:()=>1.2,title:'Il cane che ringhia',
 text:`Un cane grosso, senza padrone in vista, ti sbarra la strada ringhiando.`,
 o:[{l:'Resti immobile e parli piano',min:10,out:[O(2,'g',`Si calma e se ne va annusando.`),O(1,'b',`Ti abbaia addosso per minuti interminabili.`,{m:-8})]},
    {l:'Alzi i bastoncini per sembrare più grande',req:()=>(att('appoggio')>=1),out:[O(1,'g',`Si ritira.`),O(1,'b',`Lo provochi. Ti segue ringhiando per cento metri.`,{m:-8,e:-4})]},
    {l:'Torni indietro e fai un giro largo',min:30,out:[O(1,'m',`Sicuro ma lungo.`,{e:-6})]}]},
{id:'peluche',w:()=>1,title:'Il coniglio di pezza',
 text:`Un coniglio di pezza consumato, caduto sul sentiero. Qualche bambino starà piangendo.`,
 o:[{l:'Lo porti al rifugio',out:[O(1,'g',`Lo leghi fuori dallo zaino, che si veda.`,{mem:'peluche'})]},
    {l:'Lo metti in alto su un ometto, ben visibile',min:3,out:[O(1,'g',`Chi torna indietro lo troverà.`,{m:3})]}]},
{id:'dietrocascata',w:()=>1.5,title:'Dietro la cascata',
 text:`Il sentiero passa dietro una cascata, su una cengia bagnata.`,
 o:[{l:'Passi sotto l\'acqua',out:[O(()=>(att('impermeabile')>=1)?3:1,'g',`Un velo d'acqua tra te e il mondo. Magico.`,{m:8}),O(()=>(att('impermeabile')>=1)?1:3,'b',`Fradicio in tre secondi.`,{add:['bagnati','freddo'],m:-4})]},
    {l:'Prendi la scaletta che la aggira',min:15,out:[O(1,'m',`Asciutto e senza magia.`)]}]},
{id:'spallacci',when:()=>packKg()>9,w:()=>2,title:'Le spalle',
 text:`Gli spallacci hanno arrossato la pelle. Brucia sotto la maglia.`,
 o:[{l:'Proteggi con i cerotti',use:{cerotti:2},req:()=>inv('cerotti')>=2,min:8,out:[O(1,'g',`Cuscinetti improvvisati. Funzionano.`)]},
    {l:'Stringi la cintura per spostare il peso sui fianchi',min:3,out:[O(2,'g',`Il peso scende sulle anche.`),O(1,'m',`Ora fanno male i fianchi.`,{m:-2})]},
    {l:'Sopporti',out:[O(1,'b',`La pelle si apre.`,{m:-7})]}]},
{id:'acquapesante',when:()=>S.flags.acquaPiena,w:()=>6,title:'Due litri di troppo',
 text:`L'acqua extra caricata al cartello pesa come un sasso, e in realtà i torrenti ci sono eccome.`,
 o:[{l:'Ne butti la metà',min:2,out:[O(1,'g',`Più leggero.`,{kg:-0.5})]},
    {l:'Te la tieni, non si sa mai',out:[O(1,'m',`Il cartello aveva torto, ma tu non lo sapevi.`)]},
    {l:'La bevi tutta adesso',min:5,out:[O(1,'m',`Ti senti un acquario che cammina.`,{kg:-1,e:2})]}]},
{id:'afa',ter:['betulle','valle'],when:()=>S.wx==='sole',w:()=>2.5,title:'Afa',
 text:`Nel bosco basso non c'è un filo d'aria. Il caldo è appiccicoso.`,
 o:[{l:'Rallenti e bevi spesso',min:15,out:[O(1,'g',`Ritmo da bradipo, ma stai bene.`)]},
    {l:'Tiri dritto per uscire in fretta',out:[O(1,'m',`Fuori dal bosco, zuppo.`,{e:-8}),O(1,'b',`Ti gira la testa.`,{e:-10,m:-4})]}]},
{id:'soccorsi',w:()=>0.8,title:'Una chiamata di soccorso',
 text:`Un uomo ti corre incontro: il suo amico è caduto e si è rotto una gamba. Il suo telefono è scarico.`,
 o:[{l:'Chiami i soccorsi col tuo telefono',req:()=>inv('batteria')>=20,min:40,out:[O(1,'g',`L'elicottero arriva in quaranta minuti. Hai fatto la cosa giusta.`,{give:{batteria:-20},xp:15,m:10,timbro:'Hai chiamato i soccorsi'})]},
    {l:'Corri al rifugio più vicino a dare l\'allarme',min:60,out:[O(1,'g',`Arrivi senza fiato, il custode chiama via radio.`,{e:-15,xp:12,m:8})]},
    {l:'Gli dai il tuo telefono e aspetti con lui',min:50,out:[O(1,'g',`Resti con loro finché arrivano i soccorsi.`,{xp:12,m:8,e:-4,give:{batteria:-15}})]}]},
{id:'franaattiva',w:()=>S.wx==='pioggia'?2:0.6,title:'La frana attiva',
 text:`Un cartello rosso: «Pericolo caduta massi, transitare senza sostare». Sopra, la parete bagnata.`,
 o:[{l:'Passi di corsa senza fermarti',out:[O(3,'g',`Dall'altra parte. Il cuore a mille.`,{e:-6}),O(1,'b',`Un sasso ti sfiora la gamba. Sei salvo, ma tremi.`,{e:-6,m:-10})]},
    {l:'Aspetti che smetta di piovere',min:50,out:[O(1,'m',`Passa una lunga ora. Poi attraversi sereno.`,{m:-2})]}]},
{id:'borracciapersa',w:()=>1,title:'La borraccia',
 text:`Ti accorgi che la tasca laterale è vuota. La borraccia è caduta chissà dove.`,
 o:[{l:'Torni indietro a cercarla',min:40,out:[O(2,'g',`Era trecento metri indietro, nel muschio.`,{e:-6}),O(1,'b',`Non la trovi.`,{e:-6,m:-5,later:{segs:2,txt:'Senza borraccia la sete arriva presto.',fx:{e:-10,m:-4}}})]},
    {l:'Usi una bottiglia di plastica trovata al bivacco',min:5,out:[O(1,'m',`Brutta, ma funziona.`)]},
    {l:'Prosegui senza',out:[O(1,'b',`Ti pentirai.`,{later:{segs:2,txt:'Senza borraccia la sete arriva presto.',fx:{e:-10,m:-5}}})]}]},
{id:'posa',w:()=>1,title:'Puoi posare?',
 text:`Una fotografa ti chiede se può fotografarti mentre cammini verso il passo. «La luce è perfetta.»`,
 o:[{l:'Accetti e cammini su e giù tre volte',min:20,out:[O(2,'g',`Ti mostra la foto: sembri un esploratore vero.`,{m:10,timbro:'Modello per un giorno'}),O(1,'m',`Ti fa rifare la scena sette volte.`,{m:3,e:-5})]},
    {l:'Declini con un sorriso',out:[O(1,'m',`Peccato, era una bella luce.`)]}]},
{id:'direzionesbagliata',when:()=>S.wx==='nebbia'||S.wx==='nuvole',w:()=>1.5,title:'Qualcosa non torna',
 text:`Il lago dovrebbe essere a destra. È a sinistra. Da quanto stai camminando nella direzione sbagliata?`,
 o:[{l:'Controlli bussola e mappa',req:()=>(att('orientamento')>=1),min:10,out:[O(1,'m',`Venti minuti nella direzione sbagliata. Rimedi.`,{min:20})]},
